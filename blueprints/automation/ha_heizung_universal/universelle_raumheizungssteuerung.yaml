    aus_sperren:
      name: "Aus, Frostschutz und Sperren"
      icon: "mdi:snowflake-alert"
      collapsed: true
      input:
        frostschutz:
          name: "Frostschutz-Temperatur (Profil „Aus“, Sommer ohne Heizen, Sperren)"
          default: 5
          description: "Zugleich die Schwelle, ab der ein Boostwert als „Boost aktiv“ gilt (größer als dieser Wert)."
          selector:
            number:
              min: 5
              max: 12
              step: 0.5
              mode: "box"
              unit_of_measurement: "°C"
        aussensperre_aktiv:
          name: "Außentemperatursperre"
          default: true
          description: "Wie im Bestand: Bei warmer Außentemperatur gilt Frostschutz."
          selector:
            boolean: {}
        aussensperre_grenze:
          name: "Sperre ab Außentemperatur (größer als)"
          default: 20
          visible:
            field: "aussensperre_aktiv"
            value: true
          selector:
            number:
              min: 10
              max: 30
              step: 0.5
              mode: "slider"
              unit_of_measurement: "°C"
        ersatz_temperatur:
          name: "Ersatz-Sollwert bei ungültigem Profil"
          default: 16
          description: "Nur wenn die Profilauswahl ungültig ist und das Better Thermostat keinen Sollwert über Frostschutz hat."
          selector:
            number:
              min: 5
              max: 25
              step: 0.5
              mode: "box"
              unit_of_measurement: "°C"
    fenster:
      name: "Fenster und Fail-safe"
      icon: "mdi:window-open-variant"
      collapsed: true
      description: "Offene Fenster pausieren die Heizung. Fail-safe wie im Bestand: Fällt ein Kontakt aus (unknown/unavailable), bleibt der letzte Fensterstatus 10 Minuten erhalten; ein real offenes Fenster hat immer Vorrang; danach wird die Heizung freigegeben und einmalig gemeldet."
      input:
        fenster_modus:
          name: "Fensterüberwachung"
          default: "ohne"
          selector:
            select:
              mode: "list"
              options:
                - value: "ohne"
                  label: "Kein Fensterkontakt in diesem Raum"
                - value: "eigen"
                  label: "Eigene Fensterkontakte mit Fail-safe überwachen"
                - value: "extern"
                  label: "Fensterstatus eines anderen Raums mitbenutzen (nur lesen)"
        fensterkontakte:
          name: "Fensterkontakte"
          description: "Alle Kontakte, die die Heizung dieses Raums pausieren sollen."
          default: []
          visible:
            field: "fenster_modus"
            value: "eigen"
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - "binary_sensor"
                  device_class:
                    - "window"
                    - "door"
                    - "opening"
                    - "garage_door"
        fensterstatus:
          name: "Fensterstatus-Helfer (input_boolean)"
          description: "„eigen“: wird ausschließlich von dieser Automation geschrieben (vom Assistenten angelegt). „extern“: den Fensterstatus-Helfer des anderen Raums auswählen."
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - "input_boolean"
              multiple: false
        fenster_ausnahmen:
          name: "Kontakte, die Klimaanlage und PV-Heizen nicht pausieren (z. B. Balkontür)"
          default: []
          description: "Diese Kontakte pausieren nur die Heizung. Für Klimaanlage und PV-Heizen zählt der Helfer darunter."
          visible:
            field: "fenster_modus"
            value: "eigen"
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - "binary_sensor"
        fensterstatus_klima:
          name: "Fensterstatus für Klimaanlage und PV-Heizen (input_boolean, ohne die Ausnahmen)"
          default: []
          description: "Wird von dieser Automation geschrieben, wenn es Ausnahmen gibt (vom Assistenten angelegt)."
          visible:
            field: "fenster_modus"
            value: "eigen"
          selector:
            entity:
              filter:
                - domain:
                    - "input_boolean"
              multiple: false
        fenster_timer:
          name: "Fail-safe-Timer (timer, Wiederherstellen aktiv)"
          default: []
          visible:
            field: "fenster_modus"
            value: "eigen"
          selector:
            entity:
              filter:
                - domain:
                    - "timer"
              multiple: false
        fenster_frist:
          name: "Ausfallfrist"
          default: 10
          visible:
            field: "fenster_modus"
            value: "eigen"
          selector:
            number:
              min: 1
              max: 60
              step: 1
              mode: "box"
              unit_of_measurement: "min"
        fenster_reaktion:
          name: "Heizungsreaktion auf offenes Fenster"
          default: "blueprint"
          selector:
            select:
              mode: "list"
              options:
                - value: "blueprint"
                  label: "Diese Automation pausiert das Better Thermostat (keine BT-Einstellung nötig)"
                - value: "bt"
                  label: "Better Thermostat reagiert selbst (Fensterstatus-Helfer ist im BT als Fenstersensor eingetragen)"
        fenster_verzoegerung:
          name: "Heizpause beginnt nach"
          default: 60
          visible:
            field: "fenster_reaktion"
            value: "blueprint"
          selector:
            number:
              min: 0
              max: 600
              step: 10
              mode: "slider"
              unit_of_measurement: "s"
        fenster_nachlauf:
          name: "Weiterheizen nach dem Schließen nach"
          default: 120
          visible:
            field: "fenster_reaktion"
            value: "blueprint"
          selector:
            number:
              min: 0
              max: 900
              step: 10
              mode: "slider"
              unit_of_measurement: "s"
    boost:
      name: "Boost"
      icon: "mdi:fire"
      collapsed: true
      description: "Kurzzeitig höhere Temperatur. Startet nur bei einer echten Änderung des Boostwerts in Komfort, Übergang oder Urlaub; endet nach Ablauf, bei Wert = Frostschutz oder Profilwechsel."
      input:
        boost_aktiv:
          name: "Boost verwenden"
          default: false
          selector:
            boolean: {}
        boost_wert:
          name: "Boost-Temperatur (input_number, z. B. 5–25 °C)"
          default: []
          visible:
            field: "boost_aktiv"
            value: true
          selector:
            entity:
              filter:
                - domain:
                    - "input_number"
              multiple: false
        boost_timer:
          name: "Boost-Timer (Dauer im Timer, z. B. 2:00:00)"
          default: []
          visible:
            field: "boost_aktiv"
            value: true
          selector:
            entity:
              filter:
                - domain:
                    - "timer"
              multiple: false
    pv:
      name: "Zusammenarbeit mit PV-Überschussheizen"
      icon: "mdi:solar-power-variant"
      collapsed: true
      description: "Nur für Räume mit der Blueprint „PV-Überschussheizen“. Solange die PV-Steuerung verantwortlich ist und ihre befristete Sicherheitsfreigabe läuft, wird das Better Thermostat ausgeschaltet (Heizkörper zu). Läuft die Freigabe ab – z. B. weil die PV-Automation ausfällt –, übernimmt diese Automation automatisch wieder."
      input:
        pv_aktiv:
          name: "PV-Überschussheizen in diesem Raum"
          default: false
          selector:
            boolean: {}
        pv_flags:
          name: "PV-Verantwortungs-Helfer"
          description: "Regelung aktiv, Heizbefehl aktiv, IR-Auftrag offen, Startvorbereitung."
          default: []
          visible:
            field: "pv_aktiv"
            value: true
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - "input_boolean"
        pv_freigabe:
          name: "PV-Sicherheitsfreigabe (Timer)"
          default: []
          visible:
            field: "pv_aktiv"
            value: true
          selector:
            entity:
              filter:
                - domain:
                    - "timer"
              multiple: false
    erweitert:
      name: "Erweitert"
      icon: "mdi:cog"
      collapsed: true
      input:
        ausgabe_modus:
          name: "Betriebsart"
          default: "produktiv"
          description: "„Testbetrieb“ berechnet alles und schreibt das Ergebnis nur in den Status-Text – das Better Thermostat und der Boost-Timer werden nicht angesprochen."
          selector:
            select:
              mode: "list"
              options:
                - value: "produktiv"
                  label: "Normalbetrieb"
                - value: "test"
                  label: "Testbetrieb (nur berechnen und anzeigen)"
