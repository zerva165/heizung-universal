    profil_urlaub_wt:
      name: "Urlaub – Montag bis Freitag"
      icon: "mdi:palm-tree"
      collapsed: true
      description: "Tagesprogramm „Montag bis Freitag“ im Profil „Urlaub“: bis zu drei Heizphasen, jede einzeln ein- und ausschaltbar. Innerhalb einer Heizphase gilt die Solltemperatur des Profils, außerhalb die Absenktemperatur."
      visible:
        field: "urlaub_quelle"
        value: "phasen"
      input:
        urlaub_wt1_aktiv:
          name: "Heizphase 1 verwenden"
          default: true
          selector:
            boolean: {}
        urlaub_wt1_von:
          name: "Heizphase 1 – Beginn (Solltemperatur wird gesendet)"
          default: "09:00:00"
          visible:
            field: "urlaub_wt1_aktiv"
            value: true
          selector:
            time: {}
        urlaub_wt1_bis:
          name: "Heizphase 1 – Ende (Absenkung ab)"
          default: "19:00:00"
          description: "Liegt die Uhrzeit vor dem Beginn, endet die Phase am Folgetag (über Mitternacht)."
          visible:
            field: "urlaub_wt1_aktiv"
            value: true
          selector:
            time: {}
        urlaub_wt1_vh:
          name: "Heizphase 1 – vorausschauend vorheizen"
          default: false
          visible:
            - field: "urlaub_wt1_aktiv"
              value: true
            - field: "vorheizen_aktiv"
              value: true
          selector:
            boolean: {}
        urlaub_wt1_vh_temp:
          name: "Heizphase 1 – Mindesttemperatur bis zum Beginn"
          default: 16.0
