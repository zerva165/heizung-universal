              min: 5
              max: 25
              step: 0.5
              mode: "slider"
              unit_of_measurement: "°C"
        komfort_quelle:
          name: "Zeitquelle"
          default: "phasen"
          description: "Die Tagesprogramme stehen in den drei folgenden Abschnitten dieses Profils. Alternativ einen Zeitplan-Helfer verwenden."
          selector:
            select:
              mode: "list"
              options:
                - value: "phasen"
                  label: "Drei Tagesprogramme hier einstellen (Montag bis Freitag, Samstag, Sonntag)"
                - value: "zeitplan"
                  label: "Vorhandenen Zeitplan-Helfer (schedule) verwenden"
        komfort_zeitplan:
          name: "Zeitplan-Helfer"
          default: []
          visible:
            field: "komfort_quelle"
            value: "zeitplan"
          description: "„an“ = Solltemperatur, „aus“ = Absenkung."
          selector:
            entity:
              filter:
                - domain:
                    - "schedule"
              multiple: false
        komfort_zp_vh:
          name: "Vorheizen vor jedem Zeitplan-Beginn"
          default: false
          visible:
            - field: "komfort_quelle"
              value: "zeitplan"
            - field: "vorheizen_aktiv"
              value: true
          selector:
            boolean: {}
        komfort_zp_vh_temp:
          name: "Mindesttemperatur bis zum Zeitplan-Beginn"
          default: 21.0
          visible:
            - field: "komfort_quelle"
              value: "zeitplan"
            - field: "vorheizen_aktiv"
              value: true
            - field: "komfort_zp_vh"
              value: true
          selector:
            number:
              min: 5
              max: 28
              step: 0.5
              mode: "slider"
              unit_of_measurement: "°C"
        komfort_m1_aktiv:
          name: "Mindesttemperatur-Termin 1 verwenden"
