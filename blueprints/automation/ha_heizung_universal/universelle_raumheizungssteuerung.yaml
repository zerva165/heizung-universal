  produktiv: "{{ ausgabe_modus == 'produktiv' }}"
  gueltige_profile:
    - "Komfort"
    - "Übergang"
    - "Urlaub"
    - "Sommer"
    - "Aus"
  tage_kurz:
    - "mo"
    - "di"
    - "mi"
    - "do"
    - "fr"
    - "sa"
    - "so"
  hat_status: "{{ status_text is string and status_text != '' }}"
  hat_haus_aus: "{{ haus_heizung_aus is string and haus_heizung_aus != '' }}"
  boost_ok: "{{ boost_aktiv and boost_wert is string and boost_wert != '' and boost_timer is string and boost_timer != '' }}"
  fenster_eigen: "{{ fenster_modus == 'eigen' and fensterkontakte | count > 0 and fensterstatus is string and fensterstatus != '' and fenster_timer is string and fenster_timer != '' }}"
  hat_fensterstatus: "{{ fenster_modus in ['eigen', 'extern'] and fensterstatus is string and fensterstatus != '' }}"
  pv_ok: "{{ pv_aktiv and pv_flags | count > 0 and pv_freigabe is string and pv_freigabe != '' }}"
  vorheizen_ok: "{{ (vorheizen_aktiv or mindest_aktiv or zieltermin_aktiv) and vorheizen_merker is string and vorheizen_merker != '' and vorheizen_faktor is string and vorheizen_faktor != '' }}"
  meldung_fenster: "{{ 'heizung_fensterausfall_' ~ raum_schluessel }}"
triggers:
  - alias: "Nach dem Start von Home Assistant neu berechnen und Fensterfrist abgleichen"
    trigger: "homeassistant"
    event: "start"
    id: "neustart"
  - alias: "Nach dem Neuladen der Automationen Fensterstatus abgleichen"
    trigger: "event"
    event_type: "automation_reloaded"
    id: "reload"
  - alias: "Heizprofil des Raums geändert"
    trigger: "state"
    entity_id: !input heizprofil
    to: null
    id: "profil"
  - alias: "Globaler Schalter „Heizung Aus“ geändert"
    trigger: "state"
    entity_id: !input haus_heizung_aus
    to: null
    id: "neuberechnen"
  - alias: "Außentemperatur geändert"
    trigger: "state"
    entity_id: !input aussentemperatur
    to: null
    id: "neuberechnen"
  - alias: "Raumtemperaturfühler geändert"
    trigger: "state"
    entity_id: !input raumfuehler
    to: null
    id: "raumtemperatur"
  - alias: "Raumtemperatur des Better Thermostat geändert"
    trigger: "state"
    entity_id: !input better_thermostat
    attribute: "current_temperature"
    id: "raumtemperatur"
  - alias: "Heizaktivität des Better Thermostat geändert (für die Karte)"
    trigger: "state"
    entity_id: !input better_thermostat
