conditions: []
actions:
  - alias: "Raumtemperatur und Fensterlage einlesen"
    variables:
      raum_temp: "{%- set s = states(raumfuehler) if raumfuehler is string and raumfuehler != '' else '' -%}{%- set t = s if is_number(s) else state_attr(bt, 'current_temperature') -%}{{ t | float if is_number(t) else none }}"
      fenster_defekt: "{{ (fensterkontakte | reject('is_state', 'on') | reject('is_state', 'off') | list | count) if fenster_modus == 'eigen' else 0 }}"
  - alias: "Fenster-Fail-safe ausführen (eigene Kontakte)"
    if:
      - alias: "Eigene Fensterüberwachung und Fenster-, Start- oder Reload-Ereignis"
        condition: "template"
        value_template: "{{ fenster_eigen and trigger.id in ['fenster_kontakt', 'fenster_ablauf', 'neustart', 'reload'] }}"
    then:
      - alias: "Reale Zustände der Fensterkontakte bestimmen"
        variables:
          offen: "{{ fensterkontakte | select('is_state', 'on') | list | count > 0 }}"
          defekte: "{{ fensterkontakte | reject('is_state', 'on') | reject('is_state', 'off') | list }}"
          neuer_ausfall: "{{ trigger.id == 'fenster_kontakt' and trigger.from_state is not none and trigger.from_state.state in ['on', 'off'] and (trigger.to_state is none or trigger.to_state.state not in ['on', 'off']) }}"
      - alias: "Gültige Kontakte oder technischen Ausfall behandeln"
        choose:
          - alias: "Alle Fensterkontakte melden gültig offen/geschlossen"
            conditions:
              - alias: "Keine fehlenden Kontaktzustände"
                condition: "template"
                value_template: "{{ defekte | count == 0 }}"
            sequence:
              - alias: "Laufende Ausfallfrist nach vollständiger Erholung abbrechen"
                if:
                  - alias: "Timer hat noch eine Frist"
                    condition: "template"
                    value_template: "{{ states(fenster_timer) in ['active', 'paused'] }}"
                then:
                  - alias: "Ausfalltimer beenden"
                    action: "timer.cancel"
                    target:
                      entity_id: "{{ fenster_timer }}"
              - alias: "Gültigen Fensterzustand übernehmen"
                action: "{{ 'input_boolean.turn_on' if offen else 'input_boolean.turn_off' }}"
                target:
                  entity_id: "{{ fensterstatus }}"
              - alias: "Ausfallmeldung nach Erholung entfernen"
                action: "persistent_notification.dismiss"
                data:
                  notification_id: "{{ meldung_fenster }}"
        default:
          - alias: "Neue Ausfallfrist beginnen, laufende Frist nicht verlängern"
            if:
              - alias: "Erster Ausfall, Wiederanlauf oder pausierter Timer"
                condition: "template"
                value_template: "{{ (neuer_ausfall and not is_state(fenster_timer, 'active')) or is_state(fenster_timer, 'paused') or (trigger.id in ['neustart', 'reload'] and not is_state(fenster_timer, 'active')) }}"
            then:
              - alias: "Konservative Ausfallfrist starten"
                action: "timer.start"
                target:
                  entity_id: "{{ fenster_timer }}"
                data:
                  duration: "{{ '%02d:%02d:00' % ((fenster_frist | int) // 60, (fenster_frist | int) % 60) }}"
          - alias: "Reales offenes Fenster hat immer Vorrang"
            choose:
              - alias: "Mindestens ein Kontakt meldet real offen"
                conditions:
                  - alias: "Gültige Offenmeldung vorhanden"
                    condition: "template"
                    value_template: "{{ offen }}"
                sequence:
                  - alias: "Fenster-Heizsperre einschalten"
                    action: "input_boolean.turn_on"
                    target:
                      entity_id: "{{ fensterstatus }}"
              - alias: "Keine reale Offenmeldung und Ausfallfrist beendet"
                conditions:
                  - alias: "Timer ist vollständig abgelaufen"
                    condition: "template"
                    value_template: "{{ is_state(fenster_timer, 'idle') }}"
                sequence:
                  - alias: "Heizbetrieb bei bestätigtem technischen Ausfall freigeben"
                    action: "input_boolean.turn_off"
                    target:
                      entity_id: "{{ fensterstatus }}"
          - alias: "Einmalige Meldung bei Fristablauf, keine Warnschleife"
            if:
              - alias: "Ablaufereignis dieser Ausfallfrist"
                condition: "template"
                value_template: "{{ trigger.id == 'fenster_ablauf' }}"
            then:
              - alias: "Beständige Warnung mit fester ID anzeigen"
                action: "persistent_notification.create"
                data:
                  notification_id: "{{ meldung_fenster }}"
                  title: "Heizung: Fensterkontakt-Ausfall – {{ raum_name }}"
                  message: "Seit mindestens {{ fenster_frist | int }} Minuten fehlt ein gültiger Fensterzustand: {{ defekte | join(', ') }}. {% if offen %}Ein anderer Kontakt meldet weiterhin offen; die Heizsperre bleibt aktiv.{% else %}Der normale Heizbetrieb ist wieder freigegeben. Bitte Fenster, Batterie und Funkverbindung prüfen.{% endif %} Bei gültigen Zuständen aller Kontakte wird diese Meldung automatisch entfernt."
      - alias: "Fensterstatus für Klimaanlage und PV-Heizen (ohne die Ausnahmen) nachführen"
        if:
          - alias: "Helfer für Klima und PV vorhanden"
            condition: "template"
            value_template: "{{ fensterstatus_klima is string and fensterstatus_klima != '' }}"
        then:
          - alias: "Offen, wenn ein nicht ausgenommener Kontakt offen ist"
            action: "{{ 'input_boolean.turn_on' if (fensterkontakte | reject('in', fenster_ausnahmen) | select('is_state', 'on') | list | count > 0) else 'input_boolean.turn_off' }}"
            target:
              entity_id: "{{ fensterstatus_klima }}"
  - alias: "Better Thermostat reagiert nicht auf den Fensterstatus: einmalig melden"
    if:
      - alias: "BT soll selbst reagieren, Fenster offen, BT meldet aber kein offenes Fenster"
        condition: "template"
        value_template: "{{ trigger.id == 'fenster_bt_pruefung' and fenster_reaktion == 'bt' and hat_fensterstatus and is_state(fensterstatus, 'on') and state_attr(bt, 'window_open') != true }}"
    then:
      - alias: "Hinweis auf fehlenden Fenstersensor im Better Thermostat"
        action: "persistent_notification.create"
        data:
          notification_id: "{{ 'hz_bt_fenster_' ~ raum_schluessel }}"
          title: "Heizung {{ raum_name }}: Better Thermostat reagiert nicht auf offenes Fenster"
          message: "Der Fensterstatus {{ fensterstatus }} ist seit mehreren Minuten „offen“, das Better Thermostat {{ bt }} meldet aber kein offenes Fenster. Entweder in den Better-Thermostat-Optionen den Fensterstatus als Fenstersensor eintragen oder in dieser Automation „Diese Automation pausiert das Better Thermostat“ wählen."
  - alias: "Boostwert-Änderung auswerten"
    if:
      - alias: "Echte numerische Änderung des Boostwerts (keine Wiederherstellung)"
        condition: "template"
        value_template: "{{ boost_ok and trigger.id == 'boost_wert' and trigger.from_state is not none and trigger.to_state is not none and is_number(trigger.from_state.state) and is_number(trigger.to_state.state) and trigger.from_state.state != trigger.to_state.state }}"
    then:
      - alias: "Boost starten oder beenden"
        choose:
          - alias: "Boost über Frostschutz in Komfort, Übergang oder Urlaub"
            conditions:
              - alias: "Profil und Boostwert erlauben Boost"
                condition: "template"
                value_template: "{{ states(boost_wert) | float(frostschutz) > frostschutz | float and states(profilhelfer) in ['Komfort', 'Übergang', 'Urlaub'] }}"
              - alias: "Normalbetrieb"
                condition: "template"
                value_template: "{{ produktiv }}"
            sequence:
              - alias: "Boost-Timer mit seiner Dauer starten"
                action: "timer.start"
                target:
                  entity_id: "{{ boost_timer }}"
          - alias: "Boost beenden"
            conditions:
              - alias: "Normalbetrieb"
                condition: "template"
                value_template: "{{ produktiv }}"
            sequence:
              - alias: "Boost-Timer abbrechen"
                action: "timer.cancel"
                target:
                  entity_id: "{{ boost_timer }}"
  - alias: "Bewusster Profilwechsel: Boost beenden und globalen Aus-Schalter aufheben"
    if:
      - alias: "Gültiges Profil wurde tatsächlich gewechselt"
        condition: "template"
        value_template: "{{ trigger.id == 'profil' and trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state in gueltige_profile and trigger.to_state.state in gueltige_profile and trigger.from_state.state != trigger.to_state.state and produktiv }}"
    then:
      - alias: "Laufenden Boost dieses Raums beenden"
        if:
          - alias: "Boost läuft oder ist pausiert"
            condition: "template"
            value_template: "{{ boost_ok and states(boost_timer) in ['active', 'paused'] }}"
        then:
          - alias: "Boost-Timer abbrechen"
            action: "timer.cancel"
            target:
              entity_id: "{{ boost_timer }}"
      - alias: "Globalen Schalter „Heizung Aus“ bei Wahl eines Heizprofils ausschalten"
        if:
          - alias: "Heizprofil gewählt und globaler Schalter an"
            condition: "template"
            value_template: "{{ hat_haus_aus and trigger.to_state.state != 'Aus' and is_state(haus_heizung_aus, 'on') }}"
        then:
          - alias: "Globalen Schalter ausschalten"
            action: "input_boolean.turn_off"
            target:
              entity_id: "{{ haus_heizung_aus }}"
  - alias: "Profil, Zeitplan, Vorheizen und Sperren auswerten"
    variables:
      profil: "{{ states(profilhelfer) }}"
      p_cfg: "{%- set m = {'Komfort': cfg_komfort, 'Übergang': cfg_uebergang, 'Urlaub': cfg_urlaub, 'Sommer': cfg_sommer} -%}{{ m[profil] if profil in m and (profil != 'Sommer' or sommer_heizen) else none }}"
      haus_aus: "{{ hat_haus_aus and is_state(haus_heizung_aus, 'on') }}"
      blockiert: "{{ aussensperre_aktiv and states(aussen) | float(0) > aussensperre_grenze | float }}"
      boost_laeuft: "{{ boost_ok and is_state(boost_timer, 'active') and is_number(states(boost_wert)) and states(boost_wert) | float(0) > frostschutz | float }}"
      waermeerzeuger_reduziert: "{{ waermeerzeuger is string and waermeerzeuger != '' and states(waermeerzeuger) not in ['unknown', 'unavailable'] and states(waermeerzeuger) not in waermeerzeuger_voll }}"
      plan: >-
        {%- set ns = namespace(aktiv=false, naechst=none, ende=none, vh=false, vh_ziel=0, vh_T=none, tl=[]) -%}
        {%- if p_cfg is not none -%}
        {%- if p_cfg.quelle == 'zeitplan' -%}
        {%- if p_cfg.zeitplan is string and p_cfg.zeitplan != '' -%}
        {%- set ns.aktiv = is_state(p_cfg.zeitplan, 'on') -%}
        {%- set ne = state_attr(p_cfg.zeitplan, 'next_event') -%}
        {%- if ne is not none and ne is not string -%}{%- if ns.aktiv -%}{%- set ns.ende = ne -%}{%- else -%}{%- set ns.naechst = ne -%}{%- set ns.vh = p_cfg.zp_vh -%}{%- set ns.vh_ziel = p_cfg.zp_vh_temp -%}{%- set ns.vh_T = ne -%}{%- endif -%}{%- endif -%}
        {%- endif -%}
        {%- else -%}
        {%- for ph in p_cfg.phasen if ph.an and ph.tage | count > 0 -%}
        {%- for off in [-1, 0, 1] -%}
        {%- set beginn = today_at(ph.von) + timedelta(days=off) -%}
        {%- set ende = today_at(ph.bis) + timedelta(days=off) -%}
        {%- if ende <= beginn -%}{%- set ende = ende + timedelta(days=1) -%}{%- endif -%}
        {%- if tage_kurz[beginn.weekday()] in ph.tage -%}
        {%- if beginn <= now() < ende -%}{%- set ns.aktiv = true -%}{%- if ns.ende is none or ende > ns.ende -%}{%- set ns.ende = ende -%}{%- endif -%}{%- endif -%}
        {%- if now() < beginn and (ns.naechst is none or beginn < ns.naechst) -%}{%- set ns.naechst = beginn -%}{%- set ns.vh = ph.vh -%}{%- set ns.vh_ziel = ph.vh_temp -%}{%- set zt = beginn.replace(hour=ph.vh_bis[:2] | int, minute=ph.vh_bis[3:5] | int, second=0, microsecond=0) -%}{%- set ns.vh_T = zt if zt <= beginn else beginn -%}{%- endif -%}
        {%- endif -%}
        {%- endfor -%}
        {%- endfor -%}
        {%- endif -%}
        {%- for tm in p_cfg.termine if tm.an and tm.tage | count > 0 and ((tm.art == 'm' and mindest_aktiv) or (tm.art == 'z' and zieltermin_aktiv)) -%}
        {%- for off in [-1, 0, 1] -%}
        {%- set T = today_at(tm.zeit) + timedelta(days=off) -%}
        {%- set bis = T + timedelta(minutes=(mindest_halten if tm.art == 'm' else zieltermin_halten) | float(0)) -%}
        {%- if tage_kurz[T.weekday()] in tm.tage and (now() < bis or now() <= T) and (T - now()).total_seconds() / 60 <= (vorheizen_max | float) + 1 -%}
        {%- set ns.tl = ns.tl + [{'T': T.isoformat(), 'temp': tm.temp | float(0), 'art': tm.art, 'bis': bis.isoformat()}] -%}
        {%- endif -%}
        {%- endfor -%}
        {%- endfor -%}
        {%- endif -%}
        {{ {'aktiv': ns.aktiv, 'naechst': ns.naechst.isoformat() if ns.naechst is not none else '', 'ende': ns.ende.isoformat() if ns.ende is not none else '', 'vh': ns.vh and ns.naechst is not none, 'vh_ziel': ns.vh_ziel | float(0), 'vh_T': ns.vh_T.isoformat() if ns.vh_T is not none else '', 'termine': ns.tl} }}
      merker: >-
        {%- set s = states(vorheizen_merker) if vorheizen_ok else '' -%}
        {%- set d = namespace(T='', soll='', t0='', b='', e='', st='', a='p') -%}
        {%- for teil in (s.split(';') if s not in ['unknown', 'unavailable', ''] else []) -%}
        {%- set kv = teil.split('=', 1) -%}
        {%- if kv | count == 2 -%}
        {%- if kv[0] == 'T' -%}{%- set d.T = kv[1] -%}{%- elif kv[0] == 's' -%}{%- set d.soll = kv[1] -%}{%- elif kv[0] == 't0' -%}{%- set d.t0 = kv[1] -%}{%- elif kv[0] == 'b' -%}{%- set d.b = kv[1] -%}{%- elif kv[0] == 'e' -%}{%- set d.e = kv[1] -%}{%- elif kv[0] == 'st' -%}{%- set d.st = kv[1] -%}{%- elif kv[0] == 'a' -%}{%- set d.a = kv[1] -%}{%- endif -%}
        {%- endif -%}
        {%- endfor -%}
        {{ {'T': d.T, 'soll': d.soll, 't0': d.t0, 'b': d.b, 'e': d.e, 'st': d.st, 'a': d.a} }}
  - alias: "Vorlaufzeit für das vorausschauende Vorheizen bestimmen (nur gewählte Heizphasen)"
    variables:
      vorheizen: >-
        {%- set r = namespace(an=false, start=false, L=0, roh=0, rate=0, grund='', ziel=0, Tz='', T='', soll=0, art='') -%}
        {%- if vorheizen_ok and p_cfg is not none -%}
        {%- set hp = state_attr(bt, 'heating_power') | float(0) -%}
        {%- set r.rate = (hp * 60) if 0.002 <= hp <= 0.2 else vorheizen_rate | float -%}
        {%- if waermeerzeuger_reduziert -%}{%- set r.rate = r.rate * (waermeerzeuger_faktor | float) / 100 -%}{%- endif -%}
        {%- set k = [[states(vorheizen_faktor) | float(1), 0.5] | max, 3] | min -%}
        {%- set basis = raum_temp if raum_temp is not none else p_cfg.absenk | float -%}
        {%- set phase = [{'T': plan.vh_T, 'temp': plan.vh_ziel, 'art': 'p'}] if vorheizen_aktiv and not plan.aktiv and plan.naechst != '' and plan.vh and plan.vh_T != '' else [] -%}
        {%- for cd in (plan.termine + phase) | sort(attribute='T') -%}
        {%- set T = as_datetime(cd.T) -%}
        {%- set rest = (T - now()).total_seconds() / 60 -%}
        {%- set soll = cd.temp | float -%}
        {%- set dT = [soll - basis, 0] | max -%}
        {%- set roh = ((dT / r.rate * 60) * k + (vorheizen_puffer | float)) if dT > (vorheizen_toleranz | float) else 0 -%}
        {%- set L = [roh, vorheizen_max | float] | min -%}
        {%- set g = 'halten' if now() >= T else ('läuft' if merker.T == cd.T else ('Start' if rest <= (vorheizen_max | float) and L > 0 and rest <= L else '')) -%}
        {%- if g != '' -%}
        {%- set r.an = true -%}
        {%- if soll > r.ziel -%}{%- set r.ziel = soll -%}{%- set r.Tz = cd.T -%}{%- endif -%}
        {%- if now() < T and (r.T == '' or cd.T == merker.T) -%}
        {%- set r.T = cd.T -%}{%- set r.soll = soll -%}{%- set r.art = cd.art -%}{%- set r.L = L -%}{%- set r.roh = roh -%}{%- set r.grund = g -%}{%- set r.start = (g == 'Start') -%}
        {%- endif -%}
        {%- if r.grund == '' -%}{%- set r.grund = g -%}{%- endif -%}
        {%- endif -%}
        {%- endfor -%}
        {%- endif -%}
        {{ {'an': r.an, 'start': r.start, 'L': r.L | round(0), 'begrenzt': r.roh > (vorheizen_max | float), 'bedarf': r.roh | round(0), 'rate': r.rate | round(2), 'grund': r.grund, 'ziel': r.ziel, 'Tz': r.Tz, 'T': r.T, 'soll': r.soll, 'art': r.art} }}
  - alias: "Fensterpause und PV-Pause bestimmen"
    variables:
      fenster_pause: "{%- if fenster_reaktion == 'blueprint' and hat_fensterstatus -%}{%- set alter = (now() - states[fensterstatus].last_changed).total_seconds() if states[fensterstatus] is not none else 0 -%}{{ (is_state(fensterstatus, 'on') and (alter >= fenster_verzoegerung | float or trigger.id in ['neustart', 'reload'] or is_state(bt, 'off'))) or (is_state(fensterstatus, 'off') and alter < fenster_nachlauf | float and is_state(bt, 'off') and (not hat_status or 'Fensterpause' in states(status_text))) }}{%- else -%}{{ false }}{%- endif -%}"
      pv_pause: "{{ pv_ok and pv_flags | select('is_state', 'on') | list | count > 0 and is_state(pv_freigabe, 'active') }}"
  - alias: "Solltemperatur, Heizmodus und Status bestimmen"
    variables:
      ziel: >-
        {%- if blockiert or haus_aus or profil == 'Aus' or (profil == 'Sommer' and not sommer_heizen) -%}{{ frostschutz | float }}
        {%- elif boost_laeuft -%}{{ states(boost_wert) | float }}
        {%- elif p_cfg is not none -%}{%- set regulaer = (p_cfg.soll | float) if plan.aktiv else (p_cfg.absenk | float) -%}{{ ([regulaer, vorheizen.ziel | float] | max) if vorheizen.an else regulaer }}
        {%- else -%}{%- set cur = state_attr(bt, 'temperature') | float(0) -%}{{ cur if cur > frostschutz | float else ersatz_temperatur | float }}
        {%- endif -%}
      hvac_ziel: "{{ 'off' if pv_pause or fenster_pause else 'heat' }}"
      grund: >-
        {%- if blockiert -%}Außensperre{%- elif haus_aus -%}Heizung Aus (Haus){%- elif profil == 'Aus' -%}Aus
        {%- elif profil == 'Sommer' and not sommer_heizen -%}Sommer{%- elif boost_laeuft -%}Boost
        {%- elif p_cfg is not none -%}{{ 'Heizphase' if plan.aktiv else ('Vorheizen' if vorheizen.an else 'Absenkung') }}{%- else -%}Profil ungültig{%- endif -%}
        {{- ' · Fensterpause' if fenster_pause else '' -}}{{- ' · PV-Pause' if pv_pause else '' -}}
  - alias: "Statustext für die Dashboard-Karte bilden"
    variables:
      status_neu: >-
        {%- set f = 'ohne' if not hat_fensterstatus else ('ausfall' if fenster_defekt > 0 else ('offen' if is_state(fensterstatus, 'on') else ('zu' if is_state(fensterstatus, 'off') else 'unbekannt'))) -%}
        {%- set nx = '' -%}
        {%- if plan.aktiv and plan.ende != '' -%}{%- set nx = 'A' ~ as_datetime(plan.ende).strftime('%H:%M') -%}
        {%- elif plan.naechst != '' -%}{%- set nx = 'S' ~ tage_kurz[as_datetime(plan.naechst).weekday()] ~ as_datetime(plan.naechst).strftime('%H:%M') -%}{%- endif -%}
        {{ ('v=1|bt=' ~ bt ~ '|t=' ~ (raum_temp if raum_temp is not none else '') ~ '|a=' ~ (state_attr(bt, 'hvac_action') or '')
        ~ '|p=' ~ profil ~ '|z=' ~ (ziel | float) ~ '|h=' ~ hvac_ziel ~ '|g=' ~ grund ~ '|f=' ~ f ~ '|n=' ~ fenster_defekt
        ~ '|nx=' ~ nx ~ '|vh=' ~ (((vorheizen.ziel | float) ~ '@' ~ as_datetime(vorheizen.Tz).strftime('%H:%M')) if vorheizen.an and vorheizen.Tz != '' else '')
        ~ '|m=' ~ ('test' if not produktiv else ''))[:255] }}
  - alias: "Vorausschauendes Vorheizen protokollieren und lernen"
    if:
      - alias: "Vorheizfunktion vollständig eingerichtet"
        condition: "template"
        value_template: "{{ vorheizen_ok }}"
    then:
      - alias: "Vorheizvorgang starten, verfolgen oder bewerten"
        choose:
          - alias: "Neuer Vorheizvorgang beginnt"
            conditions:
              - alias: "Vorlaufzeit erreicht und noch kein Merker"
                condition: "template"
                value_template: "{{ vorheizen.start }}"
            sequence:
              - alias: "Vorheizvorgang merken"
                action: "input_text.set_value"
                target:
                  entity_id: "{{ vorheizen_merker }}"
                data:
                  value: "{{ ('T=' ~ vorheizen.T ~ ';s=' ~ (vorheizen.soll | float) ~ ';t0=' ~ (raum_temp if raum_temp is not none else '') ~ ';b=' ~ now().isoformat() ~ ';e=;st=' ~ ('w' if waermeerzeuger_reduziert else '') ~ ';a=' ~ vorheizen.art)[:255] }}"
              - alias: "Start im Bericht festhalten"
                if:
                  - alias: "Berichtshelfer vorhanden"
                    condition: "template"
                    value_template: "{{ vorheizen_bericht is string and vorheizen_bericht != '' }}"
                then:
                  - alias: "Bericht schreiben"
                    action: "input_text.set_value"
                    target:
                      entity_id: "{{ vorheizen_bericht }}"
                    data:
                      value: "{{ ('Vorheizen seit ' ~ now().strftime('%H:%M') ~ ' für ' ~ as_datetime(vorheizen.T).strftime('%H:%M') ~ ' (' ~ ('Zieltemperatur ' if vorheizen.art == 'z' else 'Mindesttemperatur ') ~ (vorheizen.soll | float) ~ ' °C, Vorlauf ' ~ (vorheizen.L | int) ~ ' min, Rate ' ~ vorheizen.rate ~ ' K/h'~ (', Wärmeerzeuger reduziert' if waermeerzeuger_reduziert else '') ~ ')'~ (' – voraussichtlich NICHT erreichbar, benötigt ' ~ (vorheizen.bedarf | int) ~ ' min' if vorheizen.begrenzt else ''))[:255] }}"
          - alias: "Laufender Vorgang: Erreichen der Solltemperatur vor dem Termin festhalten"
            conditions:
              - alias: "Merker aktiv, Termin noch nicht erreicht, Raum warm genug, noch nicht vermerkt"
                condition: "template"
                value_template: "{{ merker.T != '' and merker.e == '' and now() < as_datetime(merker.T) and raum_temp is not none and raum_temp >= (merker.soll | float(99)) - (vorheizen_toleranz | float) }}"
            sequence:
              - alias: "Zeitpunkt des Erreichens vermerken"
                action: "input_text.set_value"
                target:
                  entity_id: "{{ vorheizen_merker }}"
                data:
                  value: "{{ ('T=' ~ merker.T ~ ';s=' ~ merker.soll ~ ';t0=' ~ merker.t0 ~ ';b=' ~ merker.b ~ ';e=' ~ now().isoformat() ~ ';st=' ~ merker.st ~ ';a=' ~ merker.a)[:255] }}"
          - alias: "Laufender Vorgang: Störungen (Fenster, Boost, PV, reduzierter Wärmeerzeuger) vermerken"
            conditions:
              - alias: "Merker aktiv und neue Störung"
                condition: "template"
                value_template: "{{ merker.T != '' and ((fenster_pause or (hat_fensterstatus and is_state(fensterstatus, 'on'))) and 'f' not in merker.st or (waermeerzeuger_reduziert and 'w' not in merker.st) or (pv_pause and 'p' not in merker.st)) }}"
            sequence:
              - alias: "Störung im Merker ergänzen"
                action: "input_text.set_value"
                target:
                  entity_id: "{{ vorheizen_merker }}"
                data:
                  value: "{{ ('T=' ~ merker.T ~ ';s=' ~ merker.soll ~ ';t0=' ~ merker.t0 ~ ';b=' ~ merker.b ~ ';e=' ~ merker.e ~ ';st=' ~ merker.st ~ ('f' if (fenster_pause or (hat_fensterstatus and is_state(fensterstatus, 'on'))) and 'f' not in merker.st else '') ~ ('w' if waermeerzeuger_reduziert and 'w' not in merker.st else '') ~ ('p' if pv_pause and 'p' not in merker.st else '') ~ ';a=' ~ merker.a)[:255] }}"
          - alias: "Termin erreicht oder Vorgang hinfällig: ehrlich bewerten und Faktor anpassen"
            conditions:
              - alias: "Merker aktiv und Termin vorbei oder Profil/Plan passt nicht mehr"
                condition: "template"
                value_template: "{{ merker.T != '' and (now() >= as_datetime(merker.T) or vorheizen.T != merker.T) }}"
            sequence:
              - alias: "Ergebnis berechnen"
                variables:
                  termin_vorbei: "{{ now() >= as_datetime(merker.T) }}"
                  erreicht: "{{ merker.e != '' or (raum_temp is not none and raum_temp >= (merker.soll | float(99)) - (vorheizen_toleranz | float)) }}"
                  minuten_frueh: "{{ ((as_datetime(merker.T) - as_datetime(merker.e)).total_seconds() / 60) | round(0) if merker.e != '' else 0 }}"
                  k_alt: "{{ [[states(vorheizen_faktor) | float(1), 0.5] | max, 3] | min }}"
                  lernbar: "{{ vorheizen_lernen and merker.st == '' }}"
                  k_neu: "{%- set k = [[states(vorheizen_faktor) | float(1), 0.5] | max, 3] | min -%}{%- set m = ((as_datetime(merker.T) - as_datetime(merker.e)).total_seconds() / 60) if merker.e != '' else 0 -%}{%- if not (now() >= as_datetime(merker.T)) or not (vorheizen_lernen and merker.st == '') -%}{{ k }}{%- elif merker.e == '' and not (raum_temp is not none and raum_temp >= (merker.soll | float(99)) - (vorheizen_toleranz | float)) -%}{{ [k * 1.2, 3] | min | round(2) }}{%- elif m > (vorheizen_puffer | float) + 15 -%}{{ [k * 0.9, 0.5] | max | round(2) }}{%- else -%}{{ k }}{%- endif -%}"
              - alias: "Korrekturfaktor speichern"
                if:
                  - alias: "Faktor hat sich geändert"
                    condition: "template"
                    value_template: "{{ k_neu | float != k_alt | float }}"
                then:
                  - alias: "Faktor setzen"
                    action: "input_number.set_value"
                    target:
                      entity_id: "{{ vorheizen_faktor }}"
                    data:
                      value: "{{ k_neu }}"
              - alias: "Ehrlichen Bericht schreiben"
                if:
                  - alias: "Berichtshelfer vorhanden"
                    condition: "template"
                    value_template: "{{ vorheizen_bericht is string and vorheizen_bericht != '' }}"
                then:
                  - alias: "Ergebnis eintragen"
                    action: "input_text.set_value"
                    target:
                      entity_id: "{{ vorheizen_bericht }}"
                    data:
                      value: "{%- set zeit = as_datetime(merker.T).strftime('%H:%M') -%}{%- set stoer = ((' Fenster' if 'f' in merker.st else '') ~ (' Wärmeerzeuger-reduziert' if 'w' in merker.st else '') ~ (' PV' if 'p' in merker.st else '')) -%}{%- set wort = 'Zieltemperatur' if merker.a == 'z' else 'Mindesttemperatur' -%}{%- if not termin_vorbei -%}{%- set kern = 'Vorheizen für ' ~ zeit ~ ' abgebrochen (Profil/Plan geändert)' -%}{%- elif erreicht -%}{%- set kern = '✔ ' ~ wort ~ ' ' ~ merker.soll ~ ' °C um ' ~ zeit ~ ' erreicht' ~ ((' (' ~ (minuten_frueh | int) ~ ' min früher)') if merker.e != '' else '') -%}{%- else -%}{%- set kern = '✘ ' ~ wort ~ ' ' ~ merker.soll ~ ' °C um ' ~ zeit ~ ' NICHT erreicht (Ist ' ~ (raum_temp if raum_temp is not none else '?') ~ ' °C)' -%}{%- endif -%}{%- set zusatz = ((' · Störung:' ~ stoer ~ ' – nicht gelernt') if stoer != '' else '') ~ ((' · Faktor ' ~ k_alt ~ '→' ~ k_neu) if k_neu | float != k_alt | float else '') -%}{{ (kern ~ zusatz)[:255] }}"
              - alias: "Merker leeren"
                action: "input_text.set_value"
                target:
                  entity_id: "{{ vorheizen_merker }}"
                data:
                  value: ""
  - alias: "Statustext für die Dashboard-Karte aktualisieren"
    if:
      - alias: "Statushelfer vorhanden und Inhalt geändert"
        condition: "template"
        value_template: "{{ hat_status and states(status_text) != status_neu }}"
    then:
      - alias: "Status schreiben"
        action: "input_text.set_value"
        target:
          entity_id: "{{ status_text }}"
        data:
          value: "{{ status_neu }}"
  - alias: "Ohne verfügbares Better Thermostat nichts senden (BT-Rückkehr rechnet neu)"
    condition: "template"
    value_template: "{{ states(bt) not in ['unknown', 'unavailable'] }}"
  - alias: "Im Testbetrieb nichts an das Better Thermostat senden"
    condition: "template"
    value_template: "{{ produktiv }}"
  - alias: "Nur geänderten Sollwert oder notwendigen Heizmodus senden"
    condition: "template"
    value_template: "{{ states(bt) != hvac_ziel or state_attr(bt, 'temperature') | float(-999) != ziel | float }}"
  - alias: "Sollwert und Heizmodus ausschließlich an das Better Thermostat übergeben"
    action: "climate.set_temperature"
    target:
      entity_id: "{{ bt }}"
    data:
      temperature: "{{ ziel | float }}"
      hvac_mode: "{{ hvac_ziel }}"
