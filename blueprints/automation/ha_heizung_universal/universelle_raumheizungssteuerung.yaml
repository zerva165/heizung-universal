              max: 28
              step: 0.5
              mode: "slider"
              unit_of_measurement: "°C"
        komfort_absenk:
          name: "Absenktemperatur"
          description: "Gilt außerhalb der Heizphasen dieses Profils."
          default: 18.0
          selector:
