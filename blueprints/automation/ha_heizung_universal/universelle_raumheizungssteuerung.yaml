# Universelle Raumheizungssteuerung – Blueprint 1 von 3
# Erzeugt mit tools/build_raumheizung.py – Änderungen bitte dort vornehmen.
blueprint:
  name: "Universelle Raumheizungssteuerung"
  description: |-
    Paketversion 1.6.0 · Heizungssteuerung für einen Raum mit Better Thermostat: Heizprofile Komfort, Übergang, Urlaub, Sommer und Aus mit eigenen Soll- und Absenktemperaturen und drei Tagesprogrammen je Profil (Montag bis Freitag, Samstag, Sonntag) mit je bis zu drei Heizphasen. Standardverhalten: Die Solltemperatur wird genau zum Beginn einer Heizphase gesendet, die Absenktemperatur zur Absenkzeit; Better Thermostat regelt die Heizkörper. Optional: vorausschauendes Vorheizen je Heizphase auf eine eigene Mindesttemperatur, Fensterüberwachung mit 10-Minuten-Fail-safe, Boost, Zusammenarbeit mit PV-Überschussheizen und Klimaautomatik.

    Pro Raum wird eine eigene Automation aus dieser Blueprint erstellt. Die benötigten Helfer und die Dashboard-Karte legt der Einrichtungsassistent an (siehe Dokumentation).

    Vorrang (von oben nach unten): Better Thermostat nicht verfügbar → Fenster (Pause) → PV-Heizkörperpause → Außensperre → Heizung Aus / Profil Aus / Sommer → Boost → Heizphase bzw. Vorheizen → Absenkung.
  domain: "automation"
  author: "HA-Heizung-Universal"
  homeassistant:
    min_version: "2026.11.0"
  input:
    geraete:
      name: "Raum und Geräte"
      icon: "mdi:home-thermometer"
      description: "Die Geräte dieses Raums. Bei einem Gerätetausch wird nur hier (bzw. in den Optionen des Better Thermostat) die neue Entität ausgewählt – Karte und Logik folgen automatisch."
      input:
        raum_name:
          name: "Raumname"
          description: "Erscheint in Meldungen, Status und auf der Dashboard-Karte."
          default: "Raum"
          selector:
            text: {}
        raum_schluessel:
          name: "Raumkennung"
          description: "Kurze Kennung ohne Leer- und Sonderzeichen, z. B. `buero`. Wird nur für die festen IDs von Meldungen verwendet. Der Einrichtungsassistent füllt sie automatisch."
          default: "raum"
          selector:
            text: {}
        better_thermostat:
          name: "Better Thermostat"
          description: "Das Better Thermostat des Raums. Es ist das einzige Stellglied dieser Automation. Die zugehörigen Heizkörperthermostate sind in den Better-Thermostat-Optionen hinterlegt."
          selector:
            entity:
              filter:
                - domain:
                    - "climate"
                  integration: "better_thermostat"
              multiple: false
        raumfuehler:
          name: "Externer Raumtemperaturfühler (optional)"
          description: "Für Status, Karte und das optionale Vorheizen. Leer lassen = Raumtemperatur des Better Thermostat verwenden (das ist i. d. R. derselbe Fühler)."
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - "sensor"
                  device_class:
                    - "temperature"
              multiple: false
        aussentemperatur:
          name: "Außentemperatur"
          description: "Für die Außentemperatursperre."
          selector:
            entity:
              filter:
                - domain:
                    - "sensor"
                  device_class:
                    - "temperature"
              multiple: false
    helfer:
      name: "Raum-Helfer"
      icon: "mdi:tune-variant"
      collapsed: true
      description: "Diese Helfer legt der Einrichtungsassistent automatisch an und trägt sie hier ein. Bei manueller Einrichtung: Heizprofil-Auswahl (input_select mit Komfort, Übergang, Sommer, Urlaub, Aus) und Status-Text (input_text, max. 255) anlegen; die übrigen nur für die jeweils aktivierte Funktion."
      input:
        heizprofil:
          name: "Heizprofil-Auswahl"
          description: "input_select mit den Optionen Komfort, Übergang, Sommer, Urlaub, Aus."
          selector:
            entity:
              filter:
                - domain:
                    - "input_select"
              multiple: false
        status_text:
          name: "Status-Text für die Dashboard-Karte (empfohlen)"
          description: "input_text (max. 255). Die Automation schreibt hier Raumtemperatur, Plan, Fensterzustand und Vorheizstatus hinein. Die Dashboard-Karte liest ausschließlich diesen Text und die Raum-Helfer – dadurch enthält sie keine Geräte-IDs."
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - "input_text"
              multiple: false
        haus_heizung_aus:
          name: "Globaler Schalter „Heizung Aus“ (optional)"
          description: "input_boolean für das ganze Haus. Ist er an, verhält sich dieser Raum wie im Profil „Aus“ (Frostschutz). Ein bewusster Profilwechsel in diesem Raum schaltet ihn wieder aus."
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - "input_boolean"
              multiple: false
    vorheizen:
      name: "Vorheizen, Mindest- und Zieltemperatur-Termine (optional, Standard: aus)"
      icon: "mdi:clock-start"
      collapsed: true
      description: "Ausgeschaltet (Standard) wird die Solltemperatur genau zum Beginn der Heizphase gesendet – ohne jede vorzeitige Sollwertänderung. Eingeschaltet erscheinen in jedem Profil je Heizphase die Felder „vorausschauend vorheizen“ und „Mindesttemperatur bis zum Beginn“. Für diese Phasen sendet die Automation möglichst spät vorher die Mindesttemperatur an das Better Thermostat, damit sie zum Beginn erreicht ist; zum Beginn folgt unverändert die reguläre Solltemperatur. Der Vorlauf wird aus Temperaturdifferenz und Aufheizrate berechnet (gelernte Rate des Better Thermostat, sonst Ersatzwert) und über einen Korrekturfaktor nachgelernt. Zum Beginn wird ehrlich bewertet, ob die Mindesttemperatur erreicht wurde. Heizzeiten und Zeitprogramme des Wärmeerzeugers werden nie verändert. Fenster, Profile, Sperren und Absenkzeiten haben Vorrang."
      input:
        vorheizen_aktiv:
          name: "Vorausschauendes Vorheizen vor Heizphasen verwenden"
          default: false
          description: "Blendet in jedem Profil je Heizphase die Vorheiz-Felder ein."
          selector:
            boolean: {}
        mindest_aktiv:
          name: "Mindesttemperatur zu festen Uhrzeiten erreichen"
          default: false
          description: "Blendet in jedem Profil bis zu 4 Mindesttemperatur-Termine ein (Wochentage, Uhrzeit, Temperatur). Beispiel: Mittwoch 04:20 Uhr mindestens 21 °C. Der Sollwert wird dafür rechtzeitig vorher angehoben, nie abgesenkt."
          selector:
            boolean: {}
        mindest_halten:
          name: "Mindesttemperatur nach dem Termin halten"
          default: 120
          visible:
            field: "mindest_aktiv"
            value: true
          description: "So lange gilt die Mindesttemperatur nach der Uhrzeit weiter. Beginnt vorher eine Heizphase mit höherer Solltemperatur, gilt diese."
          selector:
            number:
              min: 0
              max: 480
              step: 5
              mode: "slider"
              unit_of_measurement: "min"
        zieltermin_aktiv:
          name: "Zieltemperatur zu festen Uhrzeiten erreichen"
          default: false
          description: "Blendet in jedem Profil bis zu 4 Zieltemperatur-Termine ein. Beispiel: Samstag 18:30 Uhr spätestens 22,5 °C. Die Zieltemperatur darf auch über der Solltemperatur des Profils liegen und gilt auch innerhalb einer Heizphase."
          selector:
            boolean: {}
        zieltermin_halten:
          name: "Zieltemperatur nach dem Termin halten"
          default: 60
          visible:
            field: "zieltermin_aktiv"
            value: true
          selector:
            number:
              min: 0
              max: 480
              step: 5
              mode: "slider"
              unit_of_measurement: "min"
        vorheizen_max:
          name: "Maximale Vorlaufzeit"
          default: 180
          selector:
            number:
              min: 15
              max: 720
              step: 15
              mode: "slider"
              unit_of_measurement: "min"
        vorheizen_puffer:
          name: "Zeitpuffer"
          description: "Wird zur berechneten Vorlaufzeit addiert."
          default: 15
          selector:
            number:
              min: 0
              max: 60
              step: 5
              mode: "slider"
              unit_of_measurement: "min"
        vorheizen_rate:
          name: "Ersatz-Aufheizrate"
          description: "Wird verwendet, solange das Better Thermostat noch keine plausible Aufheizrate (Attribut heating_power) gelernt hat."
          default: 1.0
          selector:
            number:
              min: 0.2
              max: 4
              step: 0.1
              mode: "slider"
              unit_of_measurement: "K/h"
        vorheizen_toleranz:
          name: "Toleranz „erreicht“"
          default: 0.3
          selector:
            number:
              min: 0
              max: 1
              step: 0.1
              mode: "slider"
              unit_of_measurement: "K"
        vorheizen_lernen:
          name: "Korrekturfaktor automatisch nachlernen"
          default: true
          selector:
            boolean: {}
        waermeerzeuger:
          name: "Heizphase des Wärmeerzeugers (optional)"
          description: "Z. B. der Betriebszustand des Heizkreises (Wärmepumpe oder Kessel). Meldet er einen reduzierten Betrieb, rechnet die Vorlaufzeit mit verminderter Heizleistung, und ein dadurch verfehltes Ziel wird nicht zum Lernen verwendet."
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - "sensor"
                    - "binary_sensor"
                    - "select"
              multiple: false
        waermeerzeuger_voll:
          name: "Zustände mit voller Heizleistung"
          default:
            - "Normal"
            - "Comfort"
            - "on"
          selector:
            select:
              multiple: true
              custom_value: true
              mode: "dropdown"
              options:
                - "Normal"
                - "Comfort"
                - "on"
                - "heating"
                - "Heating"
        waermeerzeuger_faktor:
          name: "Heizleistung im reduzierten Betrieb"
          default: 40
          selector:
            number:
              min: 10
              max: 100
              step: 5
              mode: "slider"
              unit_of_measurement: "%"
        vorheizen_faktor:
          name: "Helfer: Korrekturfaktor (input_number 0,5–3)"
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - "input_number"
              multiple: false
        vorheizen_merker:
          name: "Helfer: laufender Vorheizvorgang (input_text)"
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - "input_text"
              multiple: false
        vorheizen_bericht:
          name: "Helfer: letzter Vorheizbericht (input_text)"
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - "input_text"
              multiple: false
    profil_komfort:
      name: "Profil Komfort"
      icon: "mdi:sofa"
      collapsed: true
      description: "Temperaturen und Heizphasen für das Profil „Komfort“. Zum „Beginn“ einer Heizphase wird die Solltemperatur an das Better Thermostat gesendet, ab „Absenkung ab“ die Absenktemperatur. Vorher oder dazwischen wird nichts verändert. Nur wenn im Abschnitt „Vorausschauendes Vorheizen“ eingeschaltet, kann je Heizphase zusätzlich eine Mindesttemperatur bis zum Beginn verlangt werden."
