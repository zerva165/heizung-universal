  - alias: "Raumheizung oder Klimaautomatik ein-/ausgeschaltet"
    trigger: "state"
    entity_id: !input raumheizung_automation
    id: "daten"
  - alias: "Klimaautomatik ein-/ausgeschaltet"
    trigger: "state"
    entity_id: !input klima_automation
    id: "daten"
  - alias: "Frist abgelaufen: Startbestätigung"
    trigger: "event"
    event_type: "timer.finished"
    event_data:
      entity_id: !input t_startfrist
    id: "timer"
  - alias: "Frist abgelaufen: Energiemangel-Toleranz"
    trigger: "event"
    event_type: "timer.finished"
    event_data:
      entity_id: !input t_mangelfrist
    id: "timer"
  - alias: "Frist abgelaufen: IR-Wiederholung"
    trigger: "event"
    event_type: "timer.finished"
    event_data:
      entity_id: !input t_wiederholung
    id: "timer"
  - alias: "Frist abgelaufen: Wärmeprüfung"
    trigger: "event"
    event_type: "timer.finished"
    event_data:
      entity_id: !input t_waermepruefung
    id: "timer"
  - alias: "Frist abgelaufen: Wiederanlaufsperre"
    trigger: "event"
