  - alias: "IR-Fehler quittiert oder gesetzt"
    trigger: "state"
    entity_id: !input f_fehler
    id: "daten"
  - alias: "Startvorbereitung geändert"
    trigger: "state"
    entity_id: !input f_vorbereitung
