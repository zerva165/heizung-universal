    id: "timer"
  - alias: "Alle 30 s: stillstehende Daten prüfen und befristete Freigabe erneuern"
    trigger: "time_pattern"
    seconds: "/30"
    id: "sicherheit"
  - alias: "Nach dem Neustart PV nicht blind fortsetzen"
    trigger: "homeassistant"
    event: "start"
    id: "boot"
  - alias: "Rückmeldung: Heizbefehl seit der Prüfzeit zurückgenommen"
    trigger: "state"
    entity_id: !input f_heizbefehl
    to: "off"
    for:
      minutes: !input pruef_aus_min
    id: "aus_pruefung"
  - alias: "Rückmeldung: Heizbefehl seit der doppelten Prüfzeit zurückgenommen (nach der Wiederholung)"
    trigger: "state"
    entity_id: !input f_heizbefehl
    to: "off"
    for: "{{ '%02d:%02d:00' % ((pruef_aus_tv | int * 2) // 60, (pruef_aus_tv | int * 2) % 60) }}"
    id: "aus_pruefung2"
conditions:
  - alias: "Nur Ablauf-Ereignisse der eigenen Timer auswerten"
    condition: "template"
    value_template: "{{ trigger.id != 'timer' or trigger.event.data.entity_id in [t_startfrist, t_mangelfrist, t_wiederholung, t_waermepruefung, t_sperre, t_freigabe, t_schaltpause, t_heizkoerper] }}"
actions:
  - alias: "Rückmeldung nach HEIZEN-AUS prüfen (eigener Lauf, danach Ende)"
    if:
      - alias: "Prüfzeit nach HEIZEN-AUS abgelaufen"
        condition: "template"
        value_template: "{{ trigger.id in ['aus_pruefung', 'aus_pruefung2'] }}"
    then:
      - alias: "Nur wenn die Klimaanlage trotz AUS weiterläuft und niemand anderes sie nutzt"
        if:
          - alias: "Leistung über der Laufschwelle, kein Heiz- oder Kühlauftrag"
            condition: "template"
            value_template: "{{ leistung_ok and is_number(states(klima_leistung)) and states(klima_leistung) | float >= laeuft_ab_w | float and is_state(f_heizbefehl, 'off') and is_state(f_auftrag, 'off') and is_state(klima_modus, 'Aus') and is_state(klima_aktiv, 'off') and not is_state(f_fehler, 'on') }}"
        then:
          - alias: "Erste Prüfung: wiederholen – zweite Prüfung: IR-Fehler"
            if:
              - alias: "Erste Prüfung"
                condition: "template"
                value_template: "{{ trigger.id == 'aus_pruefung' }}"
            then:
              - alias: "Im Logbuch festhalten"
                action: "logbook.log"
                data:
                  name: "{{ raum_name }} PV"
                  message: "Klimaanlage nimmt {{ pruef_aus_min | int }} min nach HEIZEN-AUS noch {{ states(klima_leistung) }} W auf – AUS wird einmal wiederholt."
                  entity_id: "{{ f_heizbefehl }}"
              - alias: "HEIZEN-AUS erneut senden"
                continue_on_error: true
                sequence:
                  - alias: "Stromversorgung der Klimaanlage sicherstellen"
                    if:
                      - alias: "Steckdose eingerichtet und nicht eingeschaltet"
                        condition: "template"
                        value_template: "{{ steckdose_ok and not is_state(klima_steckdose, 'on') }}"
                    then:
                      - alias: "Steckdose einschalten"
                        action: "switch.turn_on"
                        target:
                          entity_id: "{{ klima_steckdose }}"
                        continue_on_error: true
                      - alias: "Höchstens 20 s warten, bis die Steckdose „an“ meldet"
                        wait_template: "{{ is_state(klima_steckdose, 'on') }}"
                        timeout:
                          seconds: 20
                      - alias: "Nur weiter, wenn die Steckdose eingeschaltet ist"
                        condition: "template"
                        value_template: "{{ is_state(klima_steckdose, 'on') }}"
                      - alias: "Klimaanlage nach dem Einschalten hochfahren lassen"
                        delay:
                          seconds: "{{ vorlauf_s | int }}"
                  - alias: "Gelernten AUS-Zustand erneut senden"
                    action: "remote.send_command"
                    target:
                      entity_id: "{{ klima_sender }}"
                    data:
                      device: "{{ ir_geraet }}"
                      command: "{{ befehl_heizen_aus }}"
            else:
              - alias: "IR-Fehler setzen (PV gesperrt bis zur Quittierung)"
                action: "input_boolean.turn_on"
                target:
                  entity_id: "{{ f_fehler }}"
              - alias: "Dauerhafte Meldung"
                action: "persistent_notification.create"
                data:
                  notification_id: "{{ 'hz_pv_rueckmeldung_' ~ raum_schluessel }}"
                  title: "{{ raum_name }} PV: Klimaanlage läuft nach HEIZEN-AUS weiter"
                  message: "HEIZEN-AUS wurde zweimal gesendet, die Klimaanlage nimmt aber weiter {{ states(klima_leistung) }} W auf. PV-Heizen ist gesperrt. Bitte vor Ort prüfen und notfalls mit der Originalfernbedienung ausschalten, danach „IR-Fehler“ ausschalten."
              - alias: "Sichtbaren PV-Status aktualisieren"
                action: "input_text.set_value"
                target:
                  entity_id: "{{ status_text }}"
                data:
                  value: "{{ ('IR-Fehler: Klimaanlage laeuft nach HEIZEN-AUS weiter, vor Ort pruefen')[:255] }}"
      - alias: "Rückmeldungsprüfung beendet"
        stop: "Rückmeldung nach HEIZEN-AUS geprüft"
  - alias: "Aktuelle Eingangsdaten lesen"
    variables:
      x: >-
        {%- set ns = namespace(trv_zu=true, ventile_zu=true, alter_max=-999999, alter_min=999999) -%}
        {%- for t in heizkoerper -%}{%- if not (states(t) in ['heat', 'off'] and is_number(state_attr(t, 'temperature')) and state_attr(t, 'temperature') | float(99) <= 5) -%}{%- set ns.trv_zu = false -%}{%- endif -%}{%- endfor -%}
        {%- for v in ventile -%}{%- if not (is_number(states(v)) and states(v) | float(99) == 0) -%}{%- set ns.ventile_zu = false -%}{%- endif -%}{%- endfor -%}
        {%- for e in [soc, netz, akku_leistung, pv_leistung, verbrauch] -%}
        {%- set ts = (state_attr(e, zeitstempel_attribut) if zeitstempel_attribut | trim != '' else (states[e].last_reported if states[e] is not none else none)) -%}
        {%- set alt = (as_timestamp(now()) - as_timestamp(ts, 0)) -%}
        {%- set ns.alter_max = [ns.alter_max, alt] | max -%}{%- set ns.alter_min = [ns.alter_min, alt] | min -%}
        {%- endfor -%}
        {{ dict(preparing=is_state(f_vorbereitung, 'on'), radiator_deadline=states(t_heizkoerper),
         radiators_closed=(is_state(bt, 'off') and heizkoerper | count > 0 and ns.trv_zu and ns.ventile_zu),
         soc=(states(soc) | float(none)), grid=(states(netz) | float(none)), battery=(states(akku_leistung) | float(none)),
         pv=(states(pv_leistung) | float(none)), load=(states(verbrauch) | float(none)), outdoor=(states(aussen) | float(none)),
         room=(states(raumfuehler) | float(none)), target=(pv_ziel | float), profile=states(heizprofil),
         room_age=(as_timestamp(now()) - as_timestamp(states[raumfuehler].last_reported, 0) if states[raumfuehler] is not none else 999999),
         outdoor_age=(as_timestamp(now()) - as_timestamp(states[aussen].last_reported, 0) if states[aussen] is not none else 999999),
         energy_age=ns.alter_max, energy_min_age=ns.alter_min,
         armed=is_state(f_heizfreigabe, 'on'), ir_ready=is_state(f_ir_geprueft, 'on'), owner=is_state(f_regelung, 'on'),
         sent=is_state(f_heizbefehl, 'on'), pending=is_state(f_auftrag, 'on'), fault=is_state(f_fehler, 'on'), retried=is_state(f_wiederholt, 'on'),
         main_on=(this.state == 'on' if this is defined and this.state is defined else true),
         watch_on=is_state(klima_automation, 'on'), profile_on=is_state(raumheizung_automation, 'on'),
         bt_ready=(states(bt) in ['heat', 'off']), remote_ready=(is_state(klima_sender, 'on') and befehl_heizen != '' and befehl_heizen_aus != ''
           and (not steckdose_ok or states(klima_steckdose) in ['on', 'off'])),
         leistung_ok=(leistung_ok and is_number(states(klima_leistung))), laeuft=(leistung_ok and states(klima_leistung) | float(0) >= laeuft_ab_w | float),
         leistung=(states(klima_leistung) if leistung_ok else ''),
         windows_closed=(fensterkontakte | reject('is_state', 'off') | list | count == 0),
         cooling_clear=(is_state(klima_modus, 'Aus') and is_state(klima_aktiv, 'off')),
         start_w=(start_leistung | float), rise=(anstieg_min | float), baseline=(states(starttemperatur) | float(none)),
         wiederanlaufsperre=states(t_sperre), sicherheitsfreigabe=states(t_freigabe), schaltpause=states(t_schaltpause),
         waermepruefung=states(t_waermepruefung), ir_wiederholung=states(t_wiederholung),
         event=(trigger.event.data.entity_id if trigger is defined and trigger.platform == 'event' else ''),
         boot=(trigger is defined and trigger.id == 'boot'),
         helpers_ok=([t_startfrist, t_mangelfrist, t_wiederholung, t_waermepruefung, t_sperre, t_freigabe, t_schaltpause, t_heizkoerper,
           f_heizfreigabe, f_ir_geprueft, f_regelung, f_heizbefehl, f_auftrag, f_fehler, f_wiederholt, f_vorbereitung, starttemperatur, status_text]
           | select('is_state', ['unknown', 'unavailable']) | list | count == 0)) }}
  - alias: "Regelungsschritt entscheiden"
    variables:
      d: >-
        {%- set ns = namespace(reason='', op='wait', ir_fault=false) -%}
        {%- if x.boot -%}{%- set ns.reason = 'Neustart: normale Heizung wiederherstellen' -%}
        {%- elif not x.armed -%}{%- set ns.reason = 'PV-Heizfreigabe ausgeschaltet' -%}
        {%- elif not x.ir_ready -%}{%- set ns.reason = 'IR-Prueffreigabe fehlt' -%}
        {%- elif x.fault -%}{%- set ns.reason = 'IR-Sendefehler: manuell pruefen und quittieren' -%}
        {%- elif not x.main_on or not x.watch_on or not x.profile_on -%}{%- set ns.reason = 'Regelung oder Sicherheitsautomation deaktiviert' -%}
        {%- elif not x.helpers_ok -%}{%- set ns.reason = 'PV-Helfer nicht verfuegbar' -%}
        {%- elif x.profile not in pv_profile -%}{%- set ns.reason = 'Heizprofil erlaubt kein PV-Heizen' -%}
        {%- elif not x.cooling_clear -%}{%- set ns.reason = 'Kuehlbetrieb oder manuelle Klimabedienung hat Vorrang' -%}
        {%- elif not x.windows_closed -%}{%- set ns.reason = 'Fenster offen oder unbekannt' -%}
        {%- elif not x.bt_ready or not x.remote_ready -%}{%- set ns.reason = 'BT oder IR-Sender nicht verfuegbar' -%}
        {%- elif x.soc is none or x.grid is none or x.battery is none or x.pv is none or x.load is none or x.outdoor is none or x.room is none or x.target is none -%}{%- set ns.reason = 'Pflichtmesswert ist nicht numerisch' -%}
        {%- elif not (0 <= x.soc <= 100 and -100000 < x.grid < 100000 and -100000 < x.battery < 100000 and 0 <= x.pv < 100000 and 0 <= x.load < 100000 and -40 <= x.outdoor <= 60 and -10 <= x.room <= 50 and 5 < x.target <= 30) -%}{%- set ns.reason = 'Messwert unplausibel oder Raumziel ausserhalb des Bereichs' -%}
        {%- elif x.baseline is none -%}{%- set ns.reason = 'Einstellwert nicht numerisch' -%}
        {%- elif not (-60 <= x.energy_min_age and x.energy_age <= max_energie_alter | float) -%}{%- set ns.reason = 'Energiedaten fehlen oder sind zu alt' -%}
        {%- elif not (-60 <= x.room_age <= (max_raum_alter | float) * 60) -%}{%- set ns.reason = 'Raumfuehler meldet zu lange nicht' -%}
        {%- elif not (-60 <= x.outdoor_age <= (max_aussen_alter | float) * 60) -%}{%- set ns.reason = 'Aussentemperatur meldet zu lange nicht' -%}
        {%- elif x.owner and x.soc < soc_halten | float -%}{%- set ns.reason = 'Akku unter ' ~ (soc_halten | int) ~ ' Prozent' -%}
        {%- elif x.owner and x.outdoor >= aussen_ende | float -%}{%- set ns.reason = 'Aussentemperatur mindestens ' ~ aussen_ende ~ ' Grad' -%}
        {%- elif x.owner and x.sicherheitsfreigabe != 'active' -%}{%- set ns.reason = 'Befristete Heizkoerperfreigabe abgelaufen' -%}
        {%- endif -%}
        {%- set safe = ns.reason == '' -%}
        {%- set poor = safe and ((x.grid < -(netzbezug_max | float)) if x.owner else (x.grid < x.start_w or x.battery < -(akku_entladung_max | float) or x.pv <= 0)) -%}
        {%- if ns.reason -%}{%- set ns.op = 'stop' if x.owner or x.sent or x.pending or x.preparing else 'blocked' -%}
        {%- elif x.pending -%}{%- set ns.op = 'stop' -%}{%- set ns.reason = 'Unvollstaendiger IR-Auftrag: sichere Rueckgabe' -%}
        {%- elif x.owner and poor and x.event == t_mangelfrist -%}{%- set ns.op = 'stop' -%}{%- set ns.reason = 'Netzbezug ueber ' ~ (netzbezug_max | int) ~ ' W seit ' ~ (mangel_minuten | int) ~ ' Minuten' -%}
        {%- elif x.preparing and not x.owner -%}{%- set ns.op = 'stop' -%}{%- set ns.reason = 'Verwaiste Startvorbereitung' -%}
        {%- elif x.preparing and x.radiator_deadline != 'active' -%}{%- set ns.op = 'stop' -%}{%- set ns.reason = 'Heizkoerper nach ' ~ (heizkoerper_minuten | int) ~ ' Minuten nicht sicher geschlossen' -%}
        {%- elif x.owner and x.sent and not x.radiators_closed -%}{%- set ns.op = 'stop' -%}{%- set ns.reason = 'Heizkoerper nicht mehr geschlossen: Klima beenden' -%}
        {%- elif x.preparing and x.room >= x.target -%}{%- set ns.op = 'stop' -%}{%- set ns.reason = 'Raumziel bereits waehrend Startvorbereitung erreicht' -%}
        {%- elif x.preparing and x.radiators_closed -%}{%- set ns.op = 'start_heat' -%}{%- set ns.reason = 'Heizkoerper bei Frostschutz und Ventile geschlossen' -%}
        {%- elif x.preparing -%}{%- set ns.op = 'wait_radiators' -%}{%- set ns.reason = 'Warte auf Heizkoerper: Frostschutz und Ventile 0 Prozent' -%}
        {%- elif x.owner and x.sent and x.room >= x.target -%}{%- set ns.op = 'cycle_off' -%}{%- set ns.reason = 'PV-Ziel ' ~ x.target ~ ' Grad erreicht: Klima-Pause' -%}
        {%- elif x.owner and x.sent and x.waermepruefung == 'idle' -%}
        {%- if x.room < x.baseline + x.rise - 0.00001 -%}{%- set ns.op = 'stop' -%}{%- set ns.reason = 'Kein ausreichender Temperaturanstieg in ' ~ (pruef_minuten | int) ~ ' Minuten' -%}
        {%- else -%}{%- set ns.op = 'proof_reset' -%}{%- set ns.reason = 'Temperaturanstieg erkannt; naechstes Prueffenster' -%}{%- endif -%}
        {%- elif x.owner and x.sent and x.retried and x.leistung_ok and x.event == t_wiederholung and not x.laeuft -%}{%- set ns.op = 'stop' -%}{%- set ns.ir_fault = true -%}{%- set ns.reason = 'Klimaanlage reagiert auch auf die IR-Wiederholung nicht (' ~ x.leistung ~ ' W)' -%}
        {%- elif x.owner and x.sent and not x.retried and x.leistung_ok and x.event == t_wiederholung and not x.laeuft and not poor -%}{%- set ns.op = 'retry' -%}{%- set ns.reason = 'Einmalige IR-Wiederholung: Klimaanlage nimmt nur ' ~ x.leistung ~ ' W auf' -%}
        {%- elif x.owner and x.sent and not x.retried and x.ir_wiederholung == 'idle' and not x.leistung_ok and x.room < x.baseline + x.rise - 0.00001 and not poor -%}{%- set ns.op = 'retry' -%}{%- set ns.reason = 'Einmalige IR-Wiederholung wegen fehlendem Temperaturanstieg' -%}
        {%- elif x.owner and x.sent -%}{%- set ns.op = 'active' -%}{%- set ns.reason = 'PV heizt angefordert' -%}
        {%- elif x.wiederanlaufsperre != 'idle' -%}{%- set ns.reason = (sperre_minuten | int) ~ '-Minuten-Wiederanlaufsperre' -%}
        {%- elif not x.owner and x.soc < soc_start | float -%}{%- set ns.reason = 'Akku unter ' ~ (soc_start | int) ~ ' Prozent' -%}
        {%- elif not x.owner and x.outdoor >= aussen_start | float -%}{%- set ns.reason = 'Aussentemperatur nicht unter ' ~ aussen_start ~ ' Grad' -%}
        {%- elif poor -%}{%- set ns.reason = 'Nicht genug Netzeinspeisung oder Akkuentladung' -%}
        {%- elif x.room > x.target - (einschalt_abstand | float) + 0.00001 -%}{%- set ns.reason = 'PV-Pause: Raum ueber Einschaltgrenze ' ~ (x.target - (einschalt_abstand | float)) ~ ' Grad' -%}
        {%- elif x.schaltpause != 'idle' -%}{%- set ns.reason = (schaltpause_minuten | int) ~ '-Minuten-Schaltpause nach AUS' -%}
        {%- elif x.event == t_startfrist -%}{%- set ns.op = 'prepare_heat' -%}{%- set ns.reason = 'Startbedingungen erfuellt: zuerst Heizkoerper schliessen' -%}
        {%- else -%}{%- set ns.op = 'qualify' -%}{%- set ns.reason = 'Startbedingungen: ' ~ (start_bestaetigung | int) ~ ' Minuten bestaetigen' -%}
        {%- endif -%}
        {{ dict(op=ns.op, reason=ns.reason, safe=safe, poor=poor, lease=safe and x.owner and ns.op != 'stop', ir_fault=ns.ir_fault) }}
  - alias: "Bei freigegebener Sitzung die befristete Heizkörperpause verlängern"
    if:
      - alias: "Sitzung sicher und PV verantwortlich"
        condition: "template"
        value_template: "{{ d.lease }}"
    then:
      - alias: "Sicherheitsfreigabe neu starten"
        action: "timer.start"
        target:
          entity_id: "{{ t_freigabe }}"
        data:
          duration: "{{ '%02d:%02d:00' % ((freigabe_minuten | int) // 60, (freigabe_minuten | int) % 60) }}"
  - alias: "Energiemangel während PV begrenzt tolerieren"
    if:
      - alias: "PV verantwortlich und sicher"
        condition: "template"
        value_template: "{{ x.owner and d.safe and d.op != 'stop' }}"
    then:
      - alias: "Mangelfrist starten oder abbrechen"
        if:
          - alias: "Zu wenig Energie"
            condition: "template"
            value_template: "{{ d.poor }}"
        then:
          - alias: "Laufende Frist nicht verlängern"
            if:
              - alias: "Mangelfrist läuft noch nicht"
                condition: "template"
                value_template: "{{ is_state(t_mangelfrist, 'idle') }}"
            then:
              - alias: "Mangelfrist starten"
                action: "timer.start"
                target:
                  entity_id: "{{ t_mangelfrist }}"
                data:
                  duration: "{{ '%02d:%02d:00' % ((mangel_minuten | int) // 60, (mangel_minuten | int) % 60) }}"
        else:
          - alias: "Energie erholt"
            if:
              - alias: "Mangelfrist läuft"
                condition: "template"
                value_template: "{{ not is_state(t_mangelfrist, 'idle') }}"
            then:
              - alias: "Mangelfrist abbrechen"
                action: "timer.cancel"
                target:
                  entity_id: "{{ t_mangelfrist }}"
                continue_on_error: true
  - alias: "Unterbrochene Startbedingungen setzen die Bestätigung zurück"
    if:
      - alias: "Keine Qualifikation mehr und Startfrist läuft"
        condition: "template"
        value_template: "{{ d.op not in ['qualify', 'start_heat', 'prepare_heat'] and not is_state(t_startfrist, 'idle') }}"
    then:
      - alias: "Startfrist abbrechen"
        action: "timer.cancel"
        target:
          entity_id: "{{ t_startfrist }}"
        continue_on_error: true
  - alias: "Genau den aktuellen Regelungsschritt ausführen"
    choose:
      - alias: "Heizkörper vor dem Klimastart schließen"
        conditions:
          - alias: "Startvorbereitung"
            condition: "template"
            value_template: "{{ d.op == 'prepare_heat' }}"
        sequence:
          - alias: "Heizkörperfrist starten"
            action: "timer.start"
            target:
              entity_id: "{{ t_heizkoerper }}"
            data:
              duration: "{{ '%02d:%02d:00' % ((heizkoerper_minuten | int) // 60, (heizkoerper_minuten | int) % 60) }}"
          - alias: "Sicherheitsfreigabe starten"
            action: "timer.start"
            target:
              entity_id: "{{ t_freigabe }}"
            data:
              duration: "{{ '%02d:%02d:00' % ((freigabe_minuten | int) // 60, (freigabe_minuten | int) % 60) }}"
          - alias: "Startvorbereitung markieren"
            action: "input_boolean.turn_on"
            target:
              entity_id: "{{ f_vorbereitung }}"
          - alias: "PV übernimmt die Verantwortung (Raumheizung schließt die Heizkörper)"
            action: "input_boolean.turn_on"
            target:
              entity_id: "{{ f_regelung }}"
          - alias: "Sichtbaren PV-Status aktualisieren"
            action: "input_text.set_value"
            target:
              entity_id: "{{ status_text }}"
            data:
              value: "{{ ('PV: Heizkoerper schliessen; Klima wartet auf Frostschutz und Ventile 0%')[:255] }}"
      - alias: "Heizanforderung nach bestätigtem Start senden"
        conditions:
          - alias: "Heizkörper geschlossen"
            condition: "template"
            value_template: "{{ d.op == 'start_heat' }}"
        sequence:
          - alias: "HEIZEN-Befehl als abgesicherter Auftrag senden"
            continue_on_error: true
            sequence:
              - alias: "IR-Auftrag als offen markieren"
                action: "input_boolean.turn_on"
                target:
                  entity_id: "{{ f_auftrag }}"
              - alias: "Nur senden, wenn alle Heizkörper sicher geschlossen sind"
                condition: "template"
                value_template: "{%- set ns = namespace(zu=true) -%}{%- for t in heizkoerper -%}{%- if not (states(t) in ['heat', 'off'] and is_number(state_attr(t, 'temperature')) and state_attr(t, 'temperature') | float(99) <= 5) -%}{%- set ns.zu = false -%}{%- endif -%}{%- endfor -%}{%- for v in ventile -%}{%- if not (is_number(states(v)) and states(v) | float(99) == 0) -%}{%- set ns.zu = false -%}{%- endif -%}{%- endfor -%}{{ is_state(bt, 'off') and heizkoerper | count > 0 and ns.zu }}"
              - alias: "Stromversorgung der Klimaanlage sicherstellen"
                if:
                  - alias: "Steckdose eingerichtet und nicht eingeschaltet"
                    condition: "template"
                    value_template: "{{ steckdose_ok and not is_state(klima_steckdose, 'on') }}"
                then:
                  - alias: "Steckdose einschalten"
                    action: "switch.turn_on"
                    target:
                      entity_id: "{{ klima_steckdose }}"
                    continue_on_error: true
                  - alias: "Höchstens 20 s warten, bis die Steckdose „an“ meldet"
                    wait_template: "{{ is_state(klima_steckdose, 'on') }}"
                    timeout:
                      seconds: 20
                  - alias: "Nur weiter, wenn die Steckdose eingeschaltet ist"
                    condition: "template"
                    value_template: "{{ is_state(klima_steckdose, 'on') }}"
                  - alias: "Klimaanlage nach dem Einschalten hochfahren lassen"
                    delay:
                      seconds: "{{ vorlauf_s | int }}"
              - alias: "Gelernten Vollzustand HEIZEN senden"
                action: "remote.send_command"
                target:
                  entity_id: "{{ klima_sender }}"
                data:
                  device: "{{ ir_geraet }}"
                  command: "{{ befehl_heizen }}"
              - alias: "Heizbefehl als aktiv markieren"
                action: "input_boolean.turn_on"
                target:
                  entity_id: "{{ f_heizbefehl }}"
              - alias: "IR-Auftrag schließen"
                action: "input_boolean.turn_off"
                target:
                  entity_id: "{{ f_auftrag }}"
          - alias: "Nur bei erfolgreichem Senden fortsetzen"
            if:
              - alias: "Heizbefehl gesetzt und Auftrag geschlossen"
                condition: "template"
                value_template: "{{ is_state(f_heizbefehl, 'on') and is_state(f_auftrag, 'off') }}"
            then:
              - alias: "Startvorbereitung beenden"
                action: "input_boolean.turn_off"
                target:
                  entity_id: "{{ f_vorbereitung }}"
              - alias: "Heizkörperfrist abbrechen"
                action: "timer.cancel"
                target:
                  entity_id: "{{ t_heizkoerper }}"
                continue_on_error: true
              - alias: "Starttemperatur für die Wärmeprüfung merken"
                action: "input_number.set_value"
                target:
                  entity_id: "{{ starttemperatur }}"
                data:
                  value: "{{ states(raumfuehler) | float }}"
              - alias: "Wiederholungsmerker löschen"
                action: "input_boolean.turn_off"
                target:
                  entity_id: "{{ f_wiederholt }}"
              - alias: "IR-Wiederholungsfrist starten"
                action: "timer.start"
                target:
                  entity_id: "{{ t_wiederholung }}"
                data:
                  duration: "{{ '%02d:%02d:00' % ((wiederholung_minuten | int) // 60, (wiederholung_minuten | int) % 60) }}"
              - alias: "Wärmeprüfung starten"
                action: "timer.start"
                target:
                  entity_id: "{{ t_waermepruefung }}"
                data:
                  duration: "{{ '%02d:%02d:00' % ((pruef_minuten | int) // 60, (pruef_minuten | int) % 60) }}"
              - alias: "Sicherheitsfreigabe starten"
                action: "timer.start"
                target:
                  entity_id: "{{ t_freigabe }}"
                data:
                  duration: "{{ '%02d:%02d:00' % ((freigabe_minuten | int) // 60, (freigabe_minuten | int) % 60) }}"
              - alias: "PV-Verantwortung bestätigen"
                action: "input_boolean.turn_on"
                target:
                  entity_id: "{{ f_regelung }}"
              - alias: "Sichtbaren PV-Status aktualisieren"
                action: "input_text.set_value"
                target:
                  entity_id: "{{ status_text }}"
                data:
                  value: "{{ ('PV: HEIZEN angefordert; Heizwirkung wird geprueft')[:255] }}"
      - alias: "Startbestätigung beginnen oder weiterlaufen lassen"
        conditions:
          - alias: "Qualifikation"
            condition: "template"
            value_template: "{{ d.op == 'qualify' }}"
        sequence:
          - alias: "Nur eine laufende Startfrist"
            if:
              - alias: "Startfrist läuft noch nicht"
                condition: "template"
                value_template: "{{ is_state(t_startfrist, 'idle') }}"
            then:
              - alias: "Startfrist starten"
                action: "timer.start"
                target:
                  entity_id: "{{ t_startfrist }}"
                data:
                  duration: "{{ '%02d:%02d:00' % ((start_bestaetigung | int) // 60, (start_bestaetigung | int) % 60) }}"
          - alias: "Sichtbaren PV-Status aktualisieren"
            action: "input_text.set_value"
            target:
              entity_id: "{{ status_text }}"
            data:
              value: "{{ (d.reason)[:255] }}"
      - alias: "Zieltemperatur erreicht: Klimaanlage pausieren"
        conditions:
          - alias: "Obere Schwelle"
            condition: "template"
            value_template: "{{ d.op == 'cycle_off' }}"
        sequence:
          - alias: "HEIZEN-AUS-Befehl senden"
            continue_on_error: true
            sequence:
              - alias: "Stromversorgung der Klimaanlage sicherstellen"
                if:
                  - alias: "Steckdose eingerichtet und nicht eingeschaltet"
                    condition: "template"
                    value_template: "{{ steckdose_ok and not is_state(klima_steckdose, 'on') }}"
                then:
                  - alias: "Steckdose einschalten"
                    action: "switch.turn_on"
                    target:
                      entity_id: "{{ klima_steckdose }}"
                    continue_on_error: true
                  - alias: "Höchstens 20 s warten, bis die Steckdose „an“ meldet"
                    wait_template: "{{ is_state(klima_steckdose, 'on') }}"
                    timeout:
                      seconds: 20
                  - alias: "Nur weiter, wenn die Steckdose eingeschaltet ist"
                    condition: "template"
                    value_template: "{{ is_state(klima_steckdose, 'on') }}"
                  - alias: "Klimaanlage nach dem Einschalten hochfahren lassen"
                    delay:
                      seconds: "{{ vorlauf_s | int }}"
              - alias: "Gelernten AUS-Zustand senden"
                action: "remote.send_command"
                target:
                  entity_id: "{{ klima_sender }}"
                data:
                  device: "{{ ir_geraet }}"
                  command: "{{ befehl_heizen_aus }}"
              - alias: "Heizbefehl zurücknehmen"
                action: "input_boolean.turn_off"
                target:
                  entity_id: "{{ f_heizbefehl }}"
              - alias: "IR-Auftrag schließen"
                action: "input_boolean.turn_off"
                target:
                  entity_id: "{{ f_auftrag }}"
          - alias: "Nur bei erfolgreichem AUS die Pause einleiten"
            if:
              - alias: "Heizbefehl zurückgenommen"
                condition: "template"
                value_template: "{{ is_state(f_heizbefehl, 'off') }}"
            then:
              - alias: "Schaltpause starten"
                action: "timer.start"
                target:
                  entity_id: "{{ t_schaltpause }}"
                data:
                  duration: "{{ '%02d:%02d:00' % ((schaltpause_minuten | int) // 60, (schaltpause_minuten | int) % 60) }}"
              - alias: "IR-Wiederholung abbrechen"
                action: "timer.cancel"
                target:
                  entity_id: "{{ t_wiederholung }}"
                continue_on_error: true
              - alias: "Wärmeprüfung abbrechen"
                action: "timer.cancel"
                target:
                  entity_id: "{{ t_waermepruefung }}"
                continue_on_error: true
              - alias: "Sichtbaren PV-Status aktualisieren"
                action: "input_text.set_value"
                target:
                  entity_id: "{{ status_text }}"
                data:
                  value: "{{ ('PV-Regelung: Temperaturpause bis Einschaltgrenze')[:255] }}"
      - alias: "Höchstens eine IR-Wiederholung je Heizzyklus"
        conditions:
          - alias: "Wiederholung"
            condition: "template"
            value_template: "{{ d.op == 'retry' }}"
        sequence:
          - alias: "Wiederholung vermerken"
            action: "input_boolean.turn_on"
            target:
              entity_id: "{{ f_wiederholt }}"
          - alias: "HEIZEN-Befehl als abgesicherter Auftrag senden"
            continue_on_error: true
            sequence:
              - alias: "IR-Auftrag als offen markieren"
                action: "input_boolean.turn_on"
                target:
                  entity_id: "{{ f_auftrag }}"
              - alias: "Nur senden, wenn alle Heizkörper sicher geschlossen sind"
                condition: "template"
                value_template: "{%- set ns = namespace(zu=true) -%}{%- for t in heizkoerper -%}{%- if not (states(t) in ['heat', 'off'] and is_number(state_attr(t, 'temperature')) and state_attr(t, 'temperature') | float(99) <= 5) -%}{%- set ns.zu = false -%}{%- endif -%}{%- endfor -%}{%- for v in ventile -%}{%- if not (is_number(states(v)) and states(v) | float(99) == 0) -%}{%- set ns.zu = false -%}{%- endif -%}{%- endfor -%}{{ is_state(bt, 'off') and heizkoerper | count > 0 and ns.zu }}"
              - alias: "Stromversorgung der Klimaanlage sicherstellen"
                if:
                  - alias: "Steckdose eingerichtet und nicht eingeschaltet"
                    condition: "template"
                    value_template: "{{ steckdose_ok and not is_state(klima_steckdose, 'on') }}"
                then:
                  - alias: "Steckdose einschalten"
                    action: "switch.turn_on"
                    target:
                      entity_id: "{{ klima_steckdose }}"
                    continue_on_error: true
                  - alias: "Höchstens 20 s warten, bis die Steckdose „an“ meldet"
                    wait_template: "{{ is_state(klima_steckdose, 'on') }}"
                    timeout:
                      seconds: 20
                  - alias: "Nur weiter, wenn die Steckdose eingeschaltet ist"
                    condition: "template"
                    value_template: "{{ is_state(klima_steckdose, 'on') }}"
                  - alias: "Klimaanlage nach dem Einschalten hochfahren lassen"
                    delay:
                      seconds: "{{ vorlauf_s | int }}"
              - alias: "Gelernten Vollzustand HEIZEN senden"
                action: "remote.send_command"
                target:
                  entity_id: "{{ klima_sender }}"
                data:
                  device: "{{ ir_geraet }}"
                  command: "{{ befehl_heizen }}"
              - alias: "Heizbefehl als aktiv markieren"
                action: "input_boolean.turn_on"
                target:
                  entity_id: "{{ f_heizbefehl }}"
              - alias: "IR-Auftrag schließen"
                action: "input_boolean.turn_off"
                target:
                  entity_id: "{{ f_auftrag }}"
          - alias: "Status bei erfolgreicher Wiederholung"
            if:
              - alias: "Auftrag geschlossen"
                condition: "template"
                value_template: "{{ is_state(f_auftrag, 'off') }}"
            then:
              - alias: "IR-Wiederholungsfrist neu starten (danach Rückmeldung über die Leistung prüfen)"
                action: "timer.start"
                target:
                  entity_id: "{{ t_wiederholung }}"
                data:
                  duration: "{{ '%02d:%02d:00' % ((wiederholung_minuten | int) // 60, (wiederholung_minuten | int) % 60) }}"
              - alias: "Sichtbaren PV-Status aktualisieren"
                action: "input_text.set_value"
                target:
                  entity_id: "{{ status_text }}"
                data:
                  value: "{{ (d.reason)[:255] }}"
      - alias: "Temperaturwirkung vorhanden: neues Prüffenster"
        conditions:
          - alias: "Prüfung bestanden"
            condition: "template"
            value_template: "{{ d.op == 'proof_reset' }}"
        sequence:
          - alias: "Neue Temperaturreferenz merken"
            action: "input_number.set_value"
            target:
              entity_id: "{{ starttemperatur }}"
            data:
              value: "{{ x.room }}"
          - alias: "Wärmeprüfung neu starten"
            action: "timer.start"
            target:
              entity_id: "{{ t_waermepruefung }}"
            data:
              duration: "{{ '%02d:%02d:00' % ((pruef_minuten | int) // 60, (pruef_minuten | int) % 60) }}"
          - alias: "Wiederholungsmerker setzen"
            action: "input_boolean.turn_on"
            target:
              entity_id: "{{ f_wiederholt }}"
          - alias: "Sichtbaren PV-Status aktualisieren"
            action: "input_text.set_value"
            target:
              entity_id: "{{ status_text }}"
            data:
              value: "{{ (d.reason)[:255] }}"
    default:
      - alias: "Sichtbaren PV-Status aktualisieren"
        action: "input_text.set_value"
        target:
          entity_id: "{{ status_text }}"
        data:
          value: "{{ (('PV: ' if x.owner else 'Blockiert: ') ~ d.reason ~ ('; Energiemangelfrist laeuft' if x.owner and d.poor else ''))[:255] }}"
  - alias: "Sichere Rückgabe bei Stopp oder fehlgeschlagenem Senden"
    if:
      - alias: "Stopp entschieden oder IR-Schritt fehlgeschlagen"
        condition: "template"
        value_template: "{{ d.op == 'stop' or (d.op == 'start_heat' and not (is_state(f_heizbefehl, 'on') and is_state(f_auftrag, 'off'))) or (d.op == 'retry' and is_state(f_auftrag, 'on')) or (d.op == 'cycle_off' and is_state(f_heizbefehl, 'on')) }}"
    then:
      - alias: "Grund und Fehlerstatus der Rückgabe bestimmen"
        variables:
          rueckgabe_grund: "{{ d.reason if d.op == 'stop' else ('IR-EIN fehlgeschlagen' if d.op == 'start_heat' else ('IR-Wiederholung fehlgeschlagen' if d.op == 'retry' else 'IR-AUS fehlgeschlagen')) }}"
          rueckgabe_fehler: "{{ (x.pending or d.ir_fault) if d.op == 'stop' else true }}"
      - alias: "Bisherige PV-Verantwortung merken"
        variables:
          hat_pv: "{{ is_state(f_regelung, 'on') or is_state(f_heizbefehl, 'on') or is_state(f_auftrag, 'on') or is_state(f_vorbereitung, 'on') }}"
      - alias: "Klimaanlage nur bei eigener Heizanforderung ausschalten"
        if:
          - alias: "Eigener Heizbefehl oder offener Auftrag"
            condition: "template"
            value_template: "{{ is_state(f_heizbefehl, 'on') or is_state(f_auftrag, 'on') }}"
        then:
          - alias: "HEIZEN-AUS-Befehl senden"
            continue_on_error: true
            sequence:
              - alias: "Stromversorgung der Klimaanlage sicherstellen"
                if:
                  - alias: "Steckdose eingerichtet und nicht eingeschaltet"
                    condition: "template"
                    value_template: "{{ steckdose_ok and not is_state(klima_steckdose, 'on') }}"
                then:
                  - alias: "Steckdose einschalten"
                    action: "switch.turn_on"
                    target:
                      entity_id: "{{ klima_steckdose }}"
                    continue_on_error: true
                  - alias: "Höchstens 20 s warten, bis die Steckdose „an“ meldet"
                    wait_template: "{{ is_state(klima_steckdose, 'on') }}"
                    timeout:
                      seconds: 20
                  - alias: "Nur weiter, wenn die Steckdose eingeschaltet ist"
                    condition: "template"
                    value_template: "{{ is_state(klima_steckdose, 'on') }}"
                  - alias: "Klimaanlage nach dem Einschalten hochfahren lassen"
                    delay:
                      seconds: "{{ vorlauf_s | int }}"
              - alias: "Gelernten AUS-Zustand senden"
                action: "remote.send_command"
                target:
                  entity_id: "{{ klima_sender }}"
                data:
                  device: "{{ ir_geraet }}"
                  command: "{{ befehl_heizen_aus }}"
              - alias: "Heizbefehl zurücknehmen"
                action: "input_boolean.turn_off"
                target:
                  entity_id: "{{ f_heizbefehl }}"
              - alias: "IR-Auftrag schließen"
                action: "input_boolean.turn_off"
                target:
                  entity_id: "{{ f_auftrag }}"
      - alias: "Startvorbereitung beenden"
        action: "input_boolean.turn_off"
        target:
          entity_id: "{{ f_vorbereitung }}"
      - alias: "Heizkörperfrist abbrechen"
        action: "timer.cancel"
        target:
          entity_id: "{{ t_heizkoerper }}"
        continue_on_error: true
      - alias: "PV-Verantwortung abgeben"
        action: "input_boolean.turn_off"
        target:
          entity_id: "{{ f_regelung }}"
      - alias: "Sicherheitsfreigabe abbrechen (Heizkörper werden sofort freigegeben)"
        action: "timer.cancel"
        target:
          entity_id: "{{ t_freigabe }}"
        continue_on_error: true
      - alias: "Fehlgeschlagene Sendung sperrt weitere Versuche"
        if:
          - alias: "Sendefehler oder Befehl nicht sicher zurückgenommen"
            condition: "template"
            value_template: "{{ rueckgabe_fehler | default(false) or is_state(f_heizbefehl, 'on') or is_state(f_auftrag, 'on') }}"
        then:
          - alias: "IR-Fehler setzen"
            action: "input_boolean.turn_on"
            target:
              entity_id: "{{ f_fehler }}"
          - alias: "PV-Heizfreigabe ausschalten"
            action: "input_boolean.turn_off"
            target:
              entity_id: "{{ f_heizfreigabe }}"
          - alias: "IR-Fehler dauerhaft melden"
            action: "persistent_notification.create"
            data:
              notification_id: "{{ 'hz_pv_ir_fehler_' ~ raum_schluessel }}"
              title: "{{ raum_name }} PV: IR-Senden fehlgeschlagen"
              message: "PV gesperrt, normale Heizung freigegeben. Klimazustand vor Ort prüfen und ggf. mit der Originalfernbedienung ausschalten. Danach „IR-Fehler“ ausschalten und die PV-Heizfreigabe erneut einschalten."
          - alias: "Sichtbaren PV-Status aktualisieren"
            action: "input_text.set_value"
            target:
              entity_id: "{{ status_text }}"
            data:
              value: "{{ ('IR-Sendefehler: PV gesperrt, Klimazustand vor Ort pruefen')[:255] }}"
      - alias: "Restliche PV-Merker zurücksetzen"
        action: "input_boolean.turn_off"
        target:
          entity_id: "{{ [f_heizbefehl, f_auftrag, f_wiederholt] }}"
        continue_on_error: true
      - alias: "Startfrist abbrechen"
        action: "timer.cancel"
        target:
          entity_id: "{{ t_startfrist }}"
        continue_on_error: true
      - alias: "Mangelfrist abbrechen"
        action: "timer.cancel"
        target:
          entity_id: "{{ t_mangelfrist }}"
        continue_on_error: true
      - alias: "IR-Wiederholung abbrechen"
        action: "timer.cancel"
        target:
          entity_id: "{{ t_wiederholung }}"
        continue_on_error: true
      - alias: "Wärmeprüfung abbrechen"
        action: "timer.cancel"
        target:
          entity_id: "{{ t_waermepruefung }}"
        continue_on_error: true
      - alias: "Nach beendetem PV-Betrieb erneute Versuche begrenzen"
        if:
          - alias: "PV war verantwortlich"
            condition: "template"
            value_template: "{{ hat_pv }}"
        then:
          - alias: "Wiederanlaufsperre starten"
            action: "timer.start"
            target:
              entity_id: "{{ t_sperre }}"
            data:
              duration: "{{ '%02d:%02d:00' % ((sperre_minuten | int) // 60, (sperre_minuten | int) % 60) }}"
          - alias: "Schaltpause starten"
            action: "timer.start"
            target:
              entity_id: "{{ t_schaltpause }}"
            data:
              duration: "{{ '%02d:%02d:00' % ((schaltpause_minuten | int) // 60, (schaltpause_minuten | int) % 60) }}"
      - alias: "Rückgabegrund anzeigen, Fehlerhinweis hat Vorrang"
        if:
          - alias: "Kein IR-Fehler"
            condition: "template"
            value_template: "{{ not is_state(f_fehler, 'on') }}"
        then:
          - alias: "Sichtbaren PV-Status aktualisieren"
            action: "input_text.set_value"
            target:
              entity_id: "{{ status_text }}"
            data:
              value: "{{ (rueckgabe_grund | default('PV beendet: normale Heizung uebernimmt'))[:255] }}"
