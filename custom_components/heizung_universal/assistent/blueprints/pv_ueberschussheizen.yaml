# PV-Überschussheizen – Blueprint 3 von 3 (optional)
# Erzeugt mit tools/build_pv.py
blueprint:
  name: "PV-Überschussheizen (Raum)"
  description: |-
    Paketversion 1.6.0 · Optionale Ergänzung für Räume mit Klimaanlage: Bei PV-Überschuss und voller Batterie heizt die Klimaanlage (IR-Vollzustand) statt der Zentralheizung. Ablauf: Startbedingungen 5 min bestätigen → Heizkörper über die Raumheizungssteuerung schließen und Ventile prüfen → Klimaanlage heizen → Wärmeprüfung mit einer IR-Wiederholung → Temperaturpause → Ende bei Energiemangel, Kälte/Wärme, Fenster, Profil oder Fehler. Sicherheitsprinzip: Die Heizkörperpause gilt nur, solange diese Automation ihre befristete Freigabe alle 30 s erneuert. Fällt sie aus, übernimmt die Raumheizung automatisch, und die Klimaautomatik schaltet die Klimaanlage ab.

    Voraussetzungen im selben Raum: „Universelle Raumheizungssteuerung“ (mit PV-Zusammenarbeit) und „Klimaautomatik“ (mit PV-Zusammenarbeit).

    Optional mit schaltbarer Messsteckdose: Strom vor jedem IR-Befehl gesichert, IR-Wiederholung nach der Leistung statt nach dem Temperaturanstieg, Rückmeldung nach HEIZEN-AUS.
  domain: "automation"
  author: "HA-Heizung-Universal"
  homeassistant:
    min_version: "2026.11.0"
  input:
    geraete:
      name: "Raum und Geräte"
      icon: "mdi:home-lightning-bolt"
      input:
        raum_name:
          name: "Raumname"
          default: "Raum"
          selector:
            text: {}
        raum_schluessel:
          name: "Raumkennung"
          default: "raum"
          selector:
            text: {}
        better_thermostat:
          name: "Better Thermostat des Raums"
          selector:
            entity:
              filter:
                - domain:
                    - "climate"
                  integration: "better_thermostat"
              multiple: false
        heizkoerper:
          name: "Heizkörperthermostate"
          description: "Alle Heizkörperthermostate des Raums. Vor dem PV-Heizen müssen alle auf Frostschutz (≤ 5 °C) stehen."
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - "climate"
        ventile:
          name: "Ventilöffnungs-Sensoren (optional)"
          default: []
          description: "Wenn vorhanden: alle müssen 0 % melden, bevor die Klimaanlage heizt."
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - "sensor"
        raumfuehler:
          name: "Raumtemperaturfühler"
          description: "Physischer Fühler (sein Meldezeitpunkt wird auf Aktualität geprüft)."
          selector:
            entity:
              filter:
                - domain:
                    - "sensor"
                  device_class:
                    - "temperature"
              multiple: false
        aussentemperatur:
          name: "Außentemperatur"
          selector:
            entity:
              filter:
                - domain:
                    - "sensor"
                  device_class:
                    - "temperature"
              multiple: false
        fensterkontakte:
          name: "Fenster, die PV-Heizen sperren"
          default: []
          description: "Vom Assistenten: der Fensterstatus des Raums (ohne die dort eingetragenen Ausnahmen)."
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - "binary_sensor"
                  device_class:
                    - "window"
                    - "door"
                    - "opening"
                - domain:
                    - "input_boolean"
        ir_konfiguration:
          name: "Gemeinsame IR-Konfiguration der Klimaautomatik (input_text)"
          description: "Derselbe Helfer wie in der Klimaautomatik dieses Raums. Von dort kommen IR-Sender, Gerätename und die Heizbefehle – hier wird kein eigener Sender gewählt, damit es nur eine Broadlink-Zuordnung je Raum gibt."
          selector:
            entity:
              filter:
                - domain:
                    - "input_text"
              multiple: false
        heizstufe:
          name: "Heizstufe der Klimaanlage beim PV-Heizen"
          default: 24
          description: "Ersetzt `{stufe}` im Heizbefehl der Klimaautomatik (z. B. `heizen_{stufe}` → `heizen_24`). Für jede hier gewählte Stufe muss der Befehl im Sender angelernt sein. Ohne `{stufe}` im Befehlsnamen wirkt diese Einstellung nicht."
          selector:
            number:
              min: 16
              max: 30
              step: 1
              mode: "box"
              unit_of_measurement: "°C"
    strom:
      name: "Stromversorgung und Rückmeldung (optional)"
      icon: "mdi:power-socket-de"
      collapsed: true
      description: "Dieselbe Messsteckdose wie in der Klimaautomatik. Vor jedem IR-Befehl wird sie bei Bedarf eingeschaltet (nie ausgeschaltet). Mit Leistungsmessung entscheidet die IR-Wiederholung nach der Leistung statt nach dem Temperaturanstieg; reagiert die Klimaanlage auch auf die Wiederholung nicht, wird PV mit IR-Fehler beendet. Läuft sie nach HEIZEN-AUS weiter, wird AUS einmal wiederholt."
      input:
        klima_steckdose:
          name: "Steckdose der Klimaanlage (optional)"
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - "switch"
              multiple: false
        vorlauf_s:
          name: "Wartezeit nach dem Einschalten der Steckdose"
          default: 30
          selector:
            number:
              min: 5
              max: 120
              step: 5
              mode: "box"
              unit_of_measurement: "s"
        klima_leistung:
          name: "Leistungsmessung der Klimaanlage (optional)"
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - "sensor"
                  device_class:
                    - "power"
              multiple: false
        laeuft_ab_w:
          name: "Klimaanlage gilt als laufend ab"
          default: 15
          selector:
            number:
              min: 2
              max: 500
              step: 1
              mode: "box"
              unit_of_measurement: "W"
        pruef_aus_min:
          name: "Rückmeldung nach HEIZEN-AUS prüfen nach"
          default: 10
          selector:
            number:
              min: 1
              max: 60
              step: 1
              mode: "box"
              unit_of_measurement: "min"
    energie:
      name: "Energiedaten"
      icon: "mdi:solar-power"
      collapsed: true
      input:
        soc:
          name: "Batterie-Ladestand (%)"
          selector:
            entity:
              filter:
                - domain:
                    - "sensor"
              multiple: false
        netz:
          name: "Netz-Einspeisung (W, positiv = Einspeisung, negativ = Bezug)"
          selector:
            entity:
              filter:
                - domain:
                    - "sensor"
              multiple: false
        akku_leistung:
          name: "Batterie-Leistung (W, positiv = Laden, negativ = Entladen)"
          selector:
            entity:
              filter:
                - domain:
                    - "sensor"
              multiple: false
        pv_leistung:
          name: "PV-Leistung (W)"
          selector:
            entity:
              filter:
                - domain:
                    - "sensor"
              multiple: false
        verbrauch:
          name: "Hausverbrauch (W)"
          selector:
            entity:
              filter:
                - domain:
                    - "sensor"
              multiple: false
        zeitstempel_attribut:
          name: "Attribut mit Zeitpunkt der letzten Aktualisierung (optional)"
          default: ""
          description: "Z. B. `last_update`. Leer = Meldezeitpunkt (last_reported) der Sensoren verwenden."
          selector:
            text: {}
        max_energie_alter:
          name: "Energiedaten höchstens so alt"
          default: 180
          selector:
            number:
              min: 30
              max: 1800
              step: 10
              mode: "slider"
              unit_of_measurement: "s"
        max_raum_alter:
          name: "Raumfühler höchstens so alt"
          default: 120
          selector:
            number:
              min: 10
              max: 720
              step: 10
              mode: "slider"
              unit_of_measurement: "min"
        max_aussen_alter:
          name: "Außentemperatur höchstens so alt"
          default: 180
          selector:
            number:
              min: 10
              max: 1440
              step: 10
              mode: "slider"
              unit_of_measurement: "min"
    schwellen:
      name: "Start- und Stoppschwellen"
      icon: "mdi:tune"
      collapsed: true
      description: "Standardwerte = bewährte Ausgangswerte."
      input:
        start_leistung:
          name: "Start: Einspeisung mindestens"
          default: 1000
          selector:
            number:
              min: 500
              max: 3000
              step: 50
              mode: "slider"
              unit_of_measurement: "W"
        soc_start:
          name: "Start: Batterie mindestens"
          default: 95
          selector:
            number:
              min: 50
              max: 100
              step: 1
              mode: "slider"
              unit_of_measurement: "%"
        soc_halten:
          name: "Weiterheizen: Batterie mindestens"
          default: 85
          selector:
            number:
              min: 20
              max: 100
              step: 1
              mode: "slider"
              unit_of_measurement: "%"
        akku_entladung_max:
          name: "Start: Batterie-Entladung höchstens"
          default: 100
          selector:
            number:
              min: 0
              max: 2000
              step: 10
              mode: "slider"
              unit_of_measurement: "W"
        aussen_start:
          name: "Start: Außentemperatur unter"
          default: 18
          selector:
            number:
              min: -10
              max: 30
              step: 0.5
              mode: "slider"
              unit_of_measurement: "°C"
        aussen_ende:
          name: "Ende: Außentemperatur ab"
          default: 19
          selector:
            number:
              min: -10
              max: 30
              step: 0.5
              mode: "slider"
              unit_of_measurement: "°C"
        netzbezug_max:
          name: "Ende: Netzbezug über (länger als Toleranz)"
          default: 300
          selector:
            number:
              min: 0
              max: 3000
              step: 50
              mode: "slider"
              unit_of_measurement: "W"
        pv_ziel:
          name: "Zieltemperatur PV-Heizen (Klima aus ab)"
          default: 24
          selector:
            number:
              min: 18
              max: 28
              step: 0.5
              mode: "slider"
              unit_of_measurement: "°C"
        einschalt_abstand:
          name: "Wieder einschalten ab Ziel minus"
          default: 0.7
          selector:
            number:
              min: 0.1
              max: 3
              step: 0.1
              mode: "slider"
              unit_of_measurement: "K"
        anstieg_min:
          name: "Wärmeprüfung: Mindestanstieg"
          default: 0.2
          selector:
            number:
              min: 0.1
              max: 1
              step: 0.1
              mode: "slider"
              unit_of_measurement: "K"
    fristen:
      name: "Fristen"
      icon: "mdi:timer-cog"
      collapsed: true
      input:
        start_bestaetigung:
          name: "Startbestätigung"
          default: 5
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: "box"
              unit_of_measurement: "min"
        mangel_minuten:
          name: "Energiemangel-Toleranz"
          default: 10
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: "box"
              unit_of_measurement: "min"
        wiederholung_minuten:
          name: "IR-Wiederholung"
          default: 10
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: "box"
              unit_of_measurement: "min"
        pruef_minuten:
          name: "Wärmeprüfung"
          default: 40
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: "box"
              unit_of_measurement: "min"
        sperre_minuten:
          name: "Wiederanlaufsperre"
          default: 30
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: "box"
              unit_of_measurement: "min"
        freigabe_minuten:
          name: "Sicherheitsfreigabe (Lease)"
          default: 2
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: "box"
              unit_of_measurement: "min"
        schaltpause_minuten:
          name: "Schaltpause nach AUS"
          default: 5
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: "box"
              unit_of_measurement: "min"
        heizkoerper_minuten:
          name: "Heizkörper-Schließfrist"
          default: 8
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: "box"
              unit_of_measurement: "min"
    kopplung:
      name: "Zusammenarbeit mit Raumheizung und Klimaautomatik"
      icon: "mdi:link-variant"
      collapsed: true
      input:
        heizprofil:
          name: "Heizprofil-Auswahl der Raumheizung"
          selector:
            entity:
              filter:
                - domain:
                    - "input_select"
              multiple: false
        pv_profile:
          name: "PV-Heizen erlaubt in den Profilen"
          default:
            - "Komfort"
            - "Übergang"
            - "Urlaub"
          selector:
            select:
              multiple: true
              mode: "list"
              options:
                - "Komfort"
                - "Übergang"
                - "Urlaub"
                - "Sommer"
                - "Aus"
        raumheizung_automation:
          name: "Raumheizungssteuerung-Automation dieses Raums"
          description: "Muss eingeschaltet sein (übernimmt die Heizkörper)."
          selector:
            entity:
              filter:
                - domain:
                    - "automation"
              multiple: false
        klima_automation:
          name: "Klimaautomatik-Automation dieses Raums"
          description: "Muss eingeschaltet sein (Notrückgabe bei Ausfall)."
          selector:
            entity:
              filter:
                - domain:
                    - "automation"
              multiple: false
        klima_modus:
          name: "Klima-Modus der Klimaautomatik"
          selector:
            entity:
              filter:
                - domain:
                    - "input_select"
              multiple: false
        klima_aktiv:
          name: "Kühlbefehl aktiv der Klimaautomatik"
          selector:
            entity:
              filter:
                - domain:
                    - "input_boolean"
              multiple: false
    helfer:
      name: "PV-Helfer"
      icon: "mdi:tune-variant"
      collapsed: true
      description: "Legt der Einrichtungsassistent an (8 Timer, 8 Schalter, 1 Zahl, 1 Text)."
      input:
        t_startfrist:
          name: "Startbestätigung"
          selector:
            entity:
              filter:
                - domain:
                    - "timer"
              multiple: false
        t_mangelfrist:
          name: "Energiemangel-Toleranz"
          selector:
            entity:
              filter:
                - domain:
                    - "timer"
              multiple: false
        t_wiederholung:
          name: "IR-Wiederholung"
          selector:
            entity:
              filter:
                - domain:
                    - "timer"
              multiple: false
        t_waermepruefung:
          name: "Wärmeprüfung"
          selector:
            entity:
              filter:
                - domain:
                    - "timer"
              multiple: false
        t_sperre:
          name: "Wiederanlaufsperre"
          selector:
            entity:
              filter:
                - domain:
                    - "timer"
              multiple: false
        t_freigabe:
          name: "Sicherheitsfreigabe (Lease)"
          selector:
            entity:
              filter:
                - domain:
                    - "timer"
              multiple: false
        t_schaltpause:
          name: "Schaltpause nach AUS"
          selector:
            entity:
              filter:
                - domain:
                    - "timer"
              multiple: false
        t_heizkoerper:
          name: "Heizkörper-Schließfrist"
          selector:
            entity:
              filter:
                - domain:
                    - "timer"
              multiple: false
        f_heizfreigabe:
          name: "PV-Heizfreigabe (Schalter für den Benutzer)"
          selector:
            entity:
              filter:
                - domain:
                    - "input_boolean"
              multiple: false
        f_ir_geprueft:
          name: "IR-Befehle vor Ort geprüft (Freigabe nach Test)"
          selector:
            entity:
              filter:
                - domain:
                    - "input_boolean"
              multiple: false
        f_regelung:
          name: "Regelung aktiv (PV verantwortlich)"
          selector:
            entity:
              filter:
                - domain:
                    - "input_boolean"
              multiple: false
        f_heizbefehl:
          name: "Heizbefehl aktiv"
          selector:
            entity:
              filter:
                - domain:
                    - "input_boolean"
              multiple: false
        f_auftrag:
          name: "IR-Auftrag offen"
          selector:
            entity:
              filter:
                - domain:
                    - "input_boolean"
              multiple: false
        f_fehler:
          name: "IR-Fehler (quittierungspflichtig)"
          selector:
            entity:
              filter:
                - domain:
                    - "input_boolean"
              multiple: false
        f_wiederholt:
          name: "IR wiederholt"
          selector:
            entity:
              filter:
                - domain:
                    - "input_boolean"
              multiple: false
        f_vorbereitung:
          name: "Startvorbereitung"
          selector:
            entity:
              filter:
                - domain:
                    - "input_boolean"
              multiple: false
        starttemperatur:
          name: "Starttemperatur für die Wärmeprüfung (input_number −20…50)"
          selector:
            entity:
              filter:
                - domain:
                    - "input_number"
              multiple: false
        status_text:
          name: "PV-Status-Text (input_text)"
          selector:
            entity:
              filter:
                - domain:
                    - "input_text"
              multiple: false
mode: "queued"
max: 20
max_exceeded: "warning"
trace:
  stored_traces: 20
trigger_variables:
  pruef_aus_tv: !input pruef_aus_min
variables:
  raum_name: !input raum_name
  raum_schluessel: !input raum_schluessel
  heizkoerper: !input heizkoerper
  ventile: !input ventile
  raumfuehler: !input raumfuehler
  fensterkontakte: !input fensterkontakte
  ir_konfiguration: !input ir_konfiguration
  soc: !input soc
  netz: !input netz
  akku_leistung: !input akku_leistung
  pv_leistung: !input pv_leistung
  verbrauch: !input verbrauch
  zeitstempel_attribut: !input zeitstempel_attribut
  max_energie_alter: !input max_energie_alter
  max_raum_alter: !input max_raum_alter
  max_aussen_alter: !input max_aussen_alter
  start_leistung: !input start_leistung
  soc_start: !input soc_start
  soc_halten: !input soc_halten
  akku_entladung_max: !input akku_entladung_max
  aussen_start: !input aussen_start
  aussen_ende: !input aussen_ende
  netzbezug_max: !input netzbezug_max
  pv_ziel: !input pv_ziel
  einschalt_abstand: !input einschalt_abstand
  anstieg_min: !input anstieg_min
  heizprofil: !input heizprofil
  pv_profile: !input pv_profile
  raumheizung_automation: !input raumheizung_automation
  klima_automation: !input klima_automation
  klima_modus: !input klima_modus
  klima_aktiv: !input klima_aktiv
  starttemperatur: !input starttemperatur
  status_text: !input status_text
  heizstufe: !input heizstufe
  klima_steckdose: !input klima_steckdose
  vorlauf_s: !input vorlauf_s
  klima_leistung: !input klima_leistung
  laeuft_ab_w: !input laeuft_ab_w
  pruef_aus_min: !input pruef_aus_min
  start_bestaetigung: !input start_bestaetigung
  mangel_minuten: !input mangel_minuten
  wiederholung_minuten: !input wiederholung_minuten
  pruef_minuten: !input pruef_minuten
  sperre_minuten: !input sperre_minuten
  freigabe_minuten: !input freigabe_minuten
  schaltpause_minuten: !input schaltpause_minuten
  heizkoerper_minuten: !input heizkoerper_minuten
  t_startfrist: !input t_startfrist
  t_mangelfrist: !input t_mangelfrist
  t_wiederholung: !input t_wiederholung
  t_waermepruefung: !input t_waermepruefung
  t_sperre: !input t_sperre
  t_freigabe: !input t_freigabe
  t_schaltpause: !input t_schaltpause
  t_heizkoerper: !input t_heizkoerper
  f_heizfreigabe: !input f_heizfreigabe
  f_ir_geprueft: !input f_ir_geprueft
  f_regelung: !input f_regelung
  f_heizbefehl: !input f_heizbefehl
  f_auftrag: !input f_auftrag
  f_fehler: !input f_fehler
  f_wiederholt: !input f_wiederholt
  f_vorbereitung: !input f_vorbereitung
  bt: !input better_thermostat
  aussen: !input aussentemperatur
  steckdose_ok: "{{ klima_steckdose is string and klima_steckdose != '' }}"
  leistung_ok: "{{ klima_leistung is string and klima_leistung != '' }}"
  ir_cfg: "{%- set d = namespace(s='', g='', h='', ha='') -%}{%- for teil in (states(ir_konfiguration) if ir_konfiguration is string and ir_konfiguration != '' else '').split('|') -%}{%- set kv = teil.split('=', 1) -%}{%- if kv | count == 2 -%}{%- if kv[0] == 's' -%}{%- set d.s = kv[1] -%}{%- elif kv[0] == 'g' -%}{%- set d.g = kv[1] -%}{%- elif kv[0] == 'h' -%}{%- set d.h = kv[1] -%}{%- elif kv[0] == 'ha' -%}{%- set d.ha = kv[1] -%}{%- endif -%}{%- endif -%}{%- endfor -%}{{ {'s': d.s, 'g': d.g, 'h': d.h, 'ha': d.ha} }}"
  klima_sender: "{{ ir_cfg.s }}"
  ir_geraet: "{{ ir_cfg.g }}"
  befehl_heizen: "{{ ir_cfg.h | replace('{stufe}', (heizstufe | int) | string) }}"
  befehl_heizen_aus: "{{ ir_cfg.ha | replace('{stufe}', (heizstufe | int) | string) }}"
triggers:
  - alias: "Energie-, Raum- oder Schutzdaten geändert"
    trigger: "state"
    entity_id: !input soc
    id: "daten"
  - alias: "Netzleistung geändert"
    trigger: "state"
    entity_id: !input netz
    id: "daten"
  - alias: "Batterieleistung geändert"
    trigger: "state"
    entity_id: !input akku_leistung
    id: "daten"
  - alias: "PV-Leistung geändert"
    trigger: "state"
    entity_id: !input pv_leistung
    id: "daten"
  - alias: "Hausverbrauch geändert"
    trigger: "state"
    entity_id: !input verbrauch
    id: "daten"
  - alias: "Raum- oder Außentemperatur geändert"
    trigger: "state"
    entity_id: !input raumfuehler
    id: "daten"
  - alias: "Außentemperatur geändert"
    trigger: "state"
    entity_id: !input aussentemperatur
    id: "daten"
  - alias: "Better Thermostat geändert"
    trigger: "state"
    entity_id: !input better_thermostat
    id: "daten"
  - alias: "Heizkörperthermostat geändert"
    trigger: "state"
    entity_id: !input heizkoerper
    id: "daten"
  - alias: "Ventilöffnung geändert"
    trigger: "state"
    entity_id: !input ventile
    id: "daten"
  - alias: "Fenster geändert"
