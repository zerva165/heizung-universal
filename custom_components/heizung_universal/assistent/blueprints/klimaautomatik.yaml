                          message: "Die Steckdose {{ klima_steckdose }} der Klimaanlage lässt sich nicht einschalten (Zustand: {{ states(klima_steckdose) }}). Der Klimabefehl wurde NICHT gesendet; der Zustand der Klimaanlage wurde nicht verändert."
                      - alias: "Im Logbuch festhalten"
                        action: "logbook.log"
                        data:
                          name: "{{ raum_name }} Klima"
                          message: "Steckdose lässt sich nicht einschalten – Befehl nicht gesendet."
                          entity_id: "{{ klima_aktiv }}"
