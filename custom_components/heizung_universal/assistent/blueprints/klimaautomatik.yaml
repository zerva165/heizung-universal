                wait_template: "{{ is_state(pv_heizbefehl, 'off') and is_state(pv_auftrag, 'off') }}"
                timeout:
                  seconds: 30
          - alias: "Klimaanlage per IR ausschalten (nur bei erreichbarem IR-Sender)"
