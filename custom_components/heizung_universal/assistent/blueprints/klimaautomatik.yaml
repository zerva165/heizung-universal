            data:
              value: "{{ modus_jetzt }}|{{ stufe_jetzt }}|{{ klima_ziel }}"
          - alias: "Bedienung hat Vorrang: laufendes PV-Heizen zuerst beenden"
            if:
              - alias: "PV-Heizen in diesem Raum freigegeben oder aktiv"
                condition: "template"
                value_template: "{{ pv_ok and (is_state(pv_heizfreigabe, 'on') or is_state(pv_heizbefehl, 'on') or is_state(pv_auftrag, 'on')) }}"
            then:
              - alias: "PV-Heizfreigabe ausschalten"
                action: "input_boolean.turn_off"
                target:
                  entity_id: "{{ pv_heizfreigabe }}"
